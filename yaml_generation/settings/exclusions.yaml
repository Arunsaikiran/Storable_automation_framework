# Columns left out of the comparison, by database. One section per data source, using the same names as db_rules.RULES.
#
# Bidirectional: a column listed under a source is left out of that source AND of the Snowflake copy, so the pair is
# compared without it. A run of a source uses its own section and the snowflake section. The snowflake section applies
# to every run, because every run compares with Snowflake (the Fivetran columns exist only there).
#
# Write each name in lower case with underscores, as the generator normalises names (spaces and hyphens become
# underscores). Table-specific exclusions go in the table rules workbook (exclude_columns column), not here.
postgres:
  exclude_columns: []

mssql:
  exclude_columns:
    - uts   # SQL Server rowversion: a binary counter that does not match Snowflake's BINARY copy

athena:
  exclude_columns: []

redshift:
  exclude_columns: []

snowflake:
  exclude_columns:
    - _fivetran_synced
    - _fivetran_deleted
    - _fivetran_id
    - _fivetran_index
    - _fivetran_active
    - _fivetran_start
    - _fivetran_end
