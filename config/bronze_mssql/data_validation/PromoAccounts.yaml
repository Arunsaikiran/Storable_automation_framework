          \ AS iBountyType,\n    COALESCE(TO_VARCHAR(t.dcBountyPct),'<<NULL>>') AS\
          \ dcBountyPct,\n    COALESCE(TO_VARCHAR(t.dcBountyAmt),'<<NULL>>') AS dcBountyAmt,\n\
          \    COALESCE(TO_CHAR(t.dCreated,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS dCreated,\n    COALESCE(TRIM(t.sAccountCode),'<<NULL>>') AS sAccountCode,\n\
          \    COALESCE(TRIM(t.sPhone1),'<<NULL>>') AS sPhone1,\n    COALESCE(TRIM(t.sPhone2),'<<NULL>>')\
          \ AS sPhone2,\n    COALESCE(TO_CHAR(t.dDisabled,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS dDisabled,\n    CASE WHEN t.bPermanent IS NULL THEN '<<NULL>>' WHEN\
          \ t.bPermanent = TRUE THEN 'TRUE' WHEN t.bPermanent = FALSE THEN 'FALSE'\
          \ ELSE '<<NULL>>' END AS bPermanent,\n    COALESCE(TO_CHAR(t.dUpdated,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS dUpdated,\n    COALESCE(TO_CHAR(t.dDeleted,'YYYY-MM-DD\
