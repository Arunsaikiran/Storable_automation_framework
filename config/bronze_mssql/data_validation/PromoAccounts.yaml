        targetcolumn: PromoAccountID
        targetquery: "SELECT\n    COALESCE(TO_VARCHAR(t.PromoAccountID),'<<NULL>>')\
          \ AS PromoAccountID,\n    COALESCE(TO_VARCHAR(t.SiteID),'<<NULL>>') AS SiteID,\n\
