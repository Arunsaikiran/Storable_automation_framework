          \ AS dPromoStrt,\n    COALESCE(TO_CHAR(t.dPromoEnd,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS dPromoEnd,\n    COALESCE(TO_CHAR(t.dCreated,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS dCreated,\n    COALESCE(TRIM(t.sPromotionCode),'<<NULL>>') AS sPromotionCode,\n\
