          \ AS DATETIME2(3)),121),'<<NULL>>') AS dPromoEnd,\n    COALESCE(CONVERT(VARCHAR(23),CAST(dCreated\
          \ AS DATETIME2(3)),121),'<<NULL>>') AS dCreated,\n    COALESCE(TRIM(sPromotionCode),'<<NULL>>')\
          \ AS sPromotionCode,\n    COALESCE(TRIM(sPromoDescription),'<<NULL>>') AS\
          \ sPromoDescription,\n    COALESCE(TRIM(sPromoComment),'<<NULL>>') AS sPromoComment,\n\
          \    COALESCE(TRIM(sWebDesc),'<<NULL>>') AS sWebDesc,\n    COALESCE(CAST(CAST(dcMarketingDollars\
          \ AS DECIMAL(38,4)) AS VARCHAR(100)),'<<NULL>>') AS dcMarketingDollars,\n\
          \    CASE WHEN bGeneric IS NULL THEN '<<NULL>>' WHEN bGeneric = 1 THEN 'TRUE'\
          \ WHEN bGeneric = 0 THEN 'FALSE' ELSE '<<NULL>>' END AS bGeneric,\n    CASE\
          \ WHEN bWebOnly IS NULL THEN '<<NULL>>' WHEN bWebOnly = 1 THEN 'TRUE' WHEN\
