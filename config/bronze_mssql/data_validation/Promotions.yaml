          \ AS PromoChannelID,\n    COALESCE(TO_VARCHAR(t.PromoFormatsID),'<<NULL>>')\
          \ AS PromoFormatsID,\n    COALESCE(TO_VARCHAR(t.PromoCampaignID),'<<NULL>>')\
