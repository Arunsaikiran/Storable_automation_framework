          \ '<<NULL>>' END AS bWebEditable,\n    COALESCE(TRIM(sCorpCode),'<<NULL>>')\
          \ AS sCorpCode,\n    CASE WHEN bSiteIsEligible IS NULL THEN '<<NULL>>' WHEN\
          \ bSiteIsEligible = 1 THEN 'TRUE' WHEN bSiteIsEligible = 0 THEN 'FALSE'\
          \ ELSE '<<NULL>>' END AS bSiteIsEligible,\n    COALESCE(CAST(PromoAccountID\
          \ AS VARCHAR(100)),'<<NULL>>') AS PromoAccountID,\n    COALESCE(CAST(PromoChannelID\
          \ AS VARCHAR(100)),'<<NULL>>') AS PromoChannelID,\n    COALESCE(CAST(PromoFormatsID\
          \ AS VARCHAR(100)),'<<NULL>>') AS PromoFormatsID,\n    COALESCE(CAST(PromoCampaignID\
          \ AS VARCHAR(100)),'<<NULL>>') AS PromoCampaignID,\n    COALESCE(CAST(PromoTypeID\
