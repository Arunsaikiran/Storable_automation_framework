          \    COALESCE(TO_VARCHAR(t.iManagedBy_CorpUserID),'<<NULL>>') AS iManagedBy_CorpUserID,\n\
          \    CASE WHEN t.bPermanent IS NULL THEN '<<NULL>>' WHEN t.bPermanent =\
