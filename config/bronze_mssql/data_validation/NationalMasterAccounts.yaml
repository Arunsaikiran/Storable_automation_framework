tables:
  NationalMasterAccounts:
    validations:
      data_validation:
        source_table_name: NationalMasterAccounts
        source: mssql
        sourcecolumn: NationalMasterAccountID
        sourcequery: "SELECT\n    COALESCE(CAST(NationalMasterAccountID AS VARCHAR(100)),'<<NULL>>')\
          \ AS NationalMasterAccountID,\n    COALESCE(TRIM(sCorpCode),'<<NULL>>')\
          \ AS sCorpCode,\n    COALESCE(CAST(iGlobalNum AS VARCHAR(100)),'<<NULL>>')\
          \ AS iGlobalNum,\n    COALESCE(TRIM(sAccountName),'<<NULL>>') AS sAccountName,\n\
          \    COALESCE(TRIM(sAccountNum),'<<NULL>>') AS sAccountNum,\n    COALESCE(TRIM(sAddr1),'<<NULL>>')\
          \ AS sAddr1,\n    COALESCE(TRIM(sAddr2),'<<NULL>>') AS sAddr2,\n    COALESCE(TRIM(sCity),'<<NULL>>')\
          \ AS sCity,\n    COALESCE(TRIM(sRegion),'<<NULL>>') AS sRegion,\n    COALESCE(TRIM(sPostalCode),'<<NULL>>')\
          \ AS sPostalCode,\n    COALESCE(TRIM(sPhone),'<<NULL>>') AS sPhone,\n  \
          \  COALESCE(TRIM(sEmail),'<<NULL>>') AS sEmail,\n    COALESCE(TRIM(sFax),'<<NULL>>')\
          \ AS sFax,\n    COALESCE(CAST(iType AS VARCHAR(100)),'<<NULL>>') AS iType,\n\
          \    COALESCE(CAST(iPromoGlobalNum AS VARCHAR(100)),'<<NULL>>') AS iPromoGlobalNum,\n\
          \    CASE WHEN bPermanent IS NULL THEN '<<NULL>>' WHEN bPermanent = 1 THEN\
          \ 'TRUE' WHEN bPermanent = 0 THEN 'FALSE' ELSE '<<NULL>>' END AS bPermanent,\n\
          \    COALESCE(CONVERT(VARCHAR(23),CAST(dCreated AS DATETIME2(3)),121),'<<NULL>>')\
          \ AS dCreated,\n    COALESCE(CONVERT(VARCHAR(23),CAST(dUpdated AS DATETIME2(3)),121),'<<NULL>>')\
          \ AS dUpdated,\n    COALESCE(CONVERT(VARCHAR(23),CAST(dDeleted AS DATETIME2(3)),121),'<<NULL>>')\
          \ AS dDeleted,\n    COALESCE(CONVERT(VARCHAR(23),CAST(dArchived AS DATETIME2(3)),121),'<<NULL>>')\
          \ AS dArchived,\n    COALESCE(CAST(OldPK AS VARCHAR(100)),'<<NULL>>') AS\
          \ OldPK\nFROM dbo.NationalMasterAccounts;"
        target_table_name: NationalMasterAccounts
        target: snowflake
        targetcolumn: NationalMasterAccountID
        targetquery: "SELECT\n    COALESCE(TO_VARCHAR(t.NationalMasterAccountID),'<<NULL>>')\
          \ AS NationalMasterAccountID,\n    COALESCE(TRIM(t.sCorpCode),'<<NULL>>')\
          \ AS sCorpCode,\n    COALESCE(TO_VARCHAR(t.iGlobalNum),'<<NULL>>') AS iGlobalNum,\n\
          \    COALESCE(TRIM(t.sAccountName),'<<NULL>>') AS sAccountName,\n    COALESCE(TRIM(t.sAccountNum),'<<NULL>>')\
          \ AS sAccountNum,\n    COALESCE(TRIM(t.sAddr1),'<<NULL>>') AS sAddr1,\n\
          \    COALESCE(TRIM(t.sAddr2),'<<NULL>>') AS sAddr2,\n    COALESCE(TRIM(t.sCity),'<<NULL>>')\
          \ AS sCity,\n    COALESCE(TRIM(t.sRegion),'<<NULL>>') AS sRegion,\n    COALESCE(TRIM(t.sPostalCode),'<<NULL>>')\
          \ AS sPostalCode,\n    COALESCE(TRIM(t.sPhone),'<<NULL>>') AS sPhone,\n\
          \    COALESCE(TRIM(t.sEmail),'<<NULL>>') AS sEmail,\n    COALESCE(TRIM(t.sFax),'<<NULL>>')\
          \ AS sFax,\n    COALESCE(TO_VARCHAR(t.iType),'<<NULL>>') AS iType,\n   \
          \ COALESCE(TO_VARCHAR(t.iPromoGlobalNum),'<<NULL>>') AS iPromoGlobalNum,\n\
          \    CASE WHEN t.bPermanent IS NULL THEN '<<NULL>>' WHEN t.bPermanent =\
          \ TRUE THEN 'TRUE' WHEN t.bPermanent = FALSE THEN 'FALSE' ELSE '<<NULL>>'\
          \ END AS bPermanent,\n    COALESCE(TO_CHAR(t.dCreated,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS dCreated,\n    COALESCE(TO_CHAR(t.dUpdated,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS dUpdated,\n    COALESCE(TO_CHAR(t.dDeleted,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS dDeleted,\n    COALESCE(TO_CHAR(t.dArchived,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS dArchived,\n    COALESCE(TO_VARCHAR(t.OldPK),'<<NULL>>') AS OldPK\n\
          FROM DEV_SITELINK_BRONZE.AWSDEV_DEVT5000_DBO.NationalMasterAccounts t\n\
          WHERE t._FIVETRAN_ACTIVE = TRUE"
