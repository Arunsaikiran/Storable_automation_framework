          \    COALESCE(TRIM(t.sAddr1Add),'<<NULL>>') AS sAddr1Add,\n    COALESCE(TRIM(t.sAddr2Add),'<<NULL>>')\
          \ AS sAddr2Add,\n    COALESCE(TRIM(t.sCityAdd),'<<NULL>>') AS sCityAdd,\n\
          \    COALESCE(TRIM(t.sRegionAdd),'<<NULL>>') AS sRegionAdd,\n    COALESCE(TRIM(t.sPostalCodeAdd),'<<NULL>>')\
          \ AS sPostalCodeAdd,\n    COALESCE(TRIM(t.sCountryAdd),'<<NULL>>') AS sCountryAdd,\n\
          \    COALESCE(TRIM(t.sPhoneAdd),'<<NULL>>') AS sPhoneAdd,\n    COALESCE(TRIM(t.sEmailAdd),'<<NULL>>')\
          \ AS sEmailAdd\nFROM DEV_SITELINK_BRONZE.AWSDEV_DEVT5000_DBO.Tenants t\n\
