          \ COALESCE(TRIM(t.sAccessCode2),'<<NULL>>') AS sAccessCode2,\n    COALESCE(TO_VARCHAR(t.iGlobalNum_NationalMasterAccount),'<<NULL>>')\
          \ AS iGlobalNum_NationalMasterAccount,\n    COALESCE(TO_VARCHAR(t.iGlobalNum_NationalFranchiseAccount),'<<NULL>>')\
