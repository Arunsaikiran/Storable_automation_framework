tables:
  AcctSoftware:
    validations:
      data_validation:
        source_table_name: AcctSoftware
        source: mssql
        sourcecolumn: AcctSoftwareID
        sourcequery: "SELECT\n    COALESCE(CAST(AcctSoftwareID AS VARCHAR(100)),'<<NULL>>')\
          \ AS AcctSoftwareID,\n    COALESCE(TRIM(sSoftwareName),'<<NULL>>') AS sSoftwareName,\n\
          \    CASE WHEN bPermanent IS NULL THEN '<<NULL>>' WHEN bPermanent = 1 THEN\
          \ 'TRUE' WHEN bPermanent = 0 THEN 'FALSE' ELSE '<<NULL>>' END AS bPermanent,\n\
          \    COALESCE(CONVERT(VARCHAR(23),CAST(dDeleted AS DATETIME2(3)),121),'<<NULL>>')\
          \ AS dDeleted,\n    COALESCE(CONVERT(VARCHAR(23),CAST(dUpdated AS DATETIME2(3)),121),'<<NULL>>')\
          \ AS dUpdated,\n    COALESCE(CAST(OldPK AS VARCHAR(100)),'<<NULL>>') AS\
          \ OldPK\nFROM dbo.AcctSoftware;"
        target_table_name: AcctSoftware
        target: snowflake
        targetcolumn: AcctSoftwareID
        targetquery: "SELECT\n    COALESCE(TO_VARCHAR(t.AcctSoftwareID),'<<NULL>>')\
          \ AS AcctSoftwareID,\n    COALESCE(TRIM(t.sSoftwareName),'<<NULL>>') AS\
          \ sSoftwareName,\n    CASE WHEN t.bPermanent IS NULL THEN '<<NULL>>' WHEN\
          \ t.bPermanent = TRUE THEN 'TRUE' WHEN t.bPermanent = FALSE THEN 'FALSE'\
          \ ELSE '<<NULL>>' END AS bPermanent,\n    COALESCE(TO_CHAR(t.dDeleted,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS dDeleted,\n    COALESCE(TO_CHAR(t.dUpdated,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS dUpdated,\n    COALESCE(TO_VARCHAR(t.OldPK),'<<NULL>>')\
          \ AS OldPK\nFROM DEV_SITELINK_BRONZE.AWSDEV_DEVT5000_DBO.AcctSoftware t\n\
          WHERE t._FIVETRAN_ACTIVE = TRUE"
