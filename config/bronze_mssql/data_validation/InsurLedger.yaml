          \ AS DECIMAL(38,4)) AS VARCHAR(100)),'<<NULL>>') AS dcSchedPremium,\n  \
          \  COALESCE(CONVERT(VARCHAR(23),CAST(dSchedPremiumStrt AS DATETIME2(3)),121),'<<NULL>>')\
          \ AS dSchedPremiumStrt,\n    COALESCE(CAST(iInitiatonType AS VARCHAR(100)),'<<NULL>>')\
          \ AS iInitiatonType,\n    COALESCE(CAST(iTerminationType AS VARCHAR(100)),'<<NULL>>')\
          \ AS iTerminationType,\n    COALESCE(CAST(iInitiationSource AS VARCHAR(100)),'<<NULL>>')\
          \ AS iInitiationSource,\n    COALESCE(CAST(iTerminationSource AS VARCHAR(100)),'<<NULL>>')\
          \ AS iTerminationSource,\n    CASE WHEN bAutoEnrollTermsAccepted IS NULL\
          \ THEN '<<NULL>>' WHEN bAutoEnrollTermsAccepted = 1 THEN 'TRUE' WHEN bAutoEnrollTermsAccepted\
          \ = 0 THEN 'FALSE' ELSE '<<NULL>>' END AS bAutoEnrollTermsAccepted,\n  \
          \  COALESCE(CAST(CAST(dcSchedCoverage AS DECIMAL(38,4)) AS VARCHAR(100)),'<<NULL>>')\
          \ AS dcSchedCoverage,\n    COALESCE(TRIM(sSchedCoverageDesc),'<<NULL>>')\
          \ AS sSchedCoverageDesc,\n    COALESCE(TRIM(sEnrollmentSource),'<<NULL>>')\
          \ AS sEnrollmentSource,\n    COALESCE(CONVERT(VARCHAR(23),CAST(dGracePeriodEndDate\
          \ AS DATETIME2(3)),121),'<<NULL>>') AS dGracePeriodEndDate\nFROM dbo.InsurLedger;"
        target_table_name: InsurLedger
