          \  COALESCE(TO_CHAR(t.dDeleted,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS dDeleted,\n    COALESCE(TO_CHAR(t.dUpdated,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS dUpdated,\n    COALESCE(TO_VARCHAR(t.OldPK),'<<NULL>>') AS OldPK,\n\
          \    COALESCE(TO_VARCHAR(t.dcSchedPremium),'<<NULL>>') AS dcSchedPremium,\n\
          \    COALESCE(TO_CHAR(t.dSchedPremiumStrt,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS dSchedPremiumStrt,\n    COALESCE(TO_VARCHAR(t.iInitiatonType),'<<NULL>>')\
