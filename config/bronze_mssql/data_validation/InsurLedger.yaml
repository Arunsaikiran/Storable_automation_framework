        source: mssql
        sourcecolumn: InsurLedgerID
        sourcequery: "SELECT\n    COALESCE(CAST(InsurLedgerID AS VARCHAR(100)),'<<NULL>>')\
          \ AS InsurLedgerID,\n    COALESCE(CAST(SiteID AS VARCHAR(100)),'<<NULL>>')\
          \ AS SiteID,\n    COALESCE(CAST(LedgerID AS VARCHAR(100)),'<<NULL>>') AS\
          \ LedgerID,\n    COALESCE(CAST(EmployeeID AS VARCHAR(100)),'<<NULL>>') AS\
          \ EmployeeID,\n    COALESCE(CAST(InsurProviderID AS VARCHAR(100)),'<<NULL>>')\
          \ AS InsurProviderID,\n    COALESCE(CAST(CAST(dcCoverage AS DECIMAL(38,4))\
          \ AS VARCHAR(100)),'<<NULL>>') AS dcCoverage,\n    COALESCE(CAST(CAST(dcPCTheft\
          \ AS DECIMAL(38,4)) AS VARCHAR(100)),'<<NULL>>') AS dcPCTheft,\n    COALESCE(TRIM(sCoverageDesc),'<<NULL>>')\
          \ AS sCoverageDesc,\n    COALESCE(CAST(CAST(dcPremium AS DECIMAL(38,4))\
          \ AS VARCHAR(100)),'<<NULL>>') AS dcPremium,\n    COALESCE(CONVERT(VARCHAR(23),CAST(dStart\
