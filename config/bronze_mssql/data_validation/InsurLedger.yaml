          \ AS DATETIME2(3)),121),'<<NULL>>') AS dCancelled,\n    COALESCE(TRIM(sPolicyNum),'<<NULL>>')\
          \ AS sPolicyNum,\n    CASE WHEN bCancelled IS NULL THEN '<<NULL>>' WHEN\
          \ bCancelled = 1 THEN 'TRUE' WHEN bCancelled = 0 THEN 'FALSE' ELSE '<<NULL>>'\
          \ END AS bCancelled,\n    CASE WHEN bTerminatedByMoveout IS NULL THEN '<<NULL>>'\
