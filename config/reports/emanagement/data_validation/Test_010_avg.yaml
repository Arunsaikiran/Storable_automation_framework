tables:
  Test_010_avg:
    validations:
      data_validation:
        source_table_name: sefms_total_move_ins_iceberg
        source: athena
        report_title: Average Length of Stay by Promotion
        test_case: Test_010_avg
        summary: Compare avg days for each promotion in the last 24 months
        sourcecolumn: legacy_avg_length_of_stay
        sourcequery: |
          WITH units AS (
          SELECT facility_id, id AS unit_id, name AS unit_name
          FROM stodl_rds_prod.sefms_units_iceberg
          ),
          move_out AS (
          SELECT
          mus.facility_id,
          mus.unit_id,
          mus.tenant_id,
          mus.move_in_date,
          DATE(CASE WHEN mus.move_out_date IS NULL THEN CURRENT_DATE - INTERVAL '1' DAY ELSE mus.move_out_date END) AS moveout_date,
          u.unit_name
          FROM stodl_reporting_prod.sefms_total_move_outs_iceberg mus
          LEFT JOIN units u ON mus.facility_id = u.facility_id AND mus.unit_id = u.unit_id
          )
          SELECT
          COALESCE(NULLIF(TRIM(CAST(mus.facility_id AS VARCHAR)), ''), '_NULL_VALUE_') AS facility_id,
          CAST(DATE_FORMAT(mus.report_date, '%Y%m%d') AS BIGINT) AS report_date,
          COALESCE(NULLIF(TRIM(CAST(
          CASE WHEN mus.discount_description LIKE '%,%' THEN 'Multiple Promotions' ELSE mus.discount_description END
          AS VARCHAR)), ''), '_NULL_VALUE_') AS promotion,
          COALESCE(NULLIF(TRIM(CAST(
          AVG(DATE_DIFF('day', mus.move_in_date, mo.moveout_date) + 2)
          AS VARCHAR)), ''), '_NULL_VALUE_') AS legacy_avg_length_of_stay
          FROM stodl_reporting_prod.sefms_total_move_ins_iceberg mus
          LEFT JOIN move_out mo
          ON mus.tenant_id = mo.tenant_id
          AND mus.unit_name = mo.unit_name
          AND mus.move_in_date = mo.move_in_date
          WHERE mus.activity_type IN ('Move In', 'Future Move In')
          AND mus.report_date >= DATE_ADD('month', -24, DATE_TRUNC('month', CURRENT_DATE))
          AND mus.report_date < DATE_ADD('month', 1, DATE_TRUNC('month', CURRENT_DATE))
          GROUP BY 1, 2, 3
          ORDER BY report_date DESC;
        target_table_name: fact_move_in
        target: snowflake
        targetcolumn: avg_length_of_stay
        targetquery: |
          SELECT
          COALESCE(CAST(f.FACILITY_ID AS VARCHAR), '_NULL_VALUE_') AS facility_id,
          d.FULL_DATE AS report_date,
          COALESCE(NULLIF(TRIM(fm1.PROMOTION_DERIVED), ''), '_NULL_VALUE_') AS promotion,
          AVG(fm1.TOTAL_LENGTH_OF_STAY_DAYS) AS avg_length_of_stay
          FROM DEV_GOLD.CORE.FACT_MOVE_IN fm1
          LEFT JOIN DEV_GOLD.DIM.DIM_FACILITY f
          ON fm1.FACILITY_KEY = f.FACILITY_KEY
          AND f.IS_CURRENT = TRUE
          LEFT JOIN DEV_GOLD.DIM.DIM_DATE d
          ON fm1.DATE_KEY_REPORT = d.DATE_KEY
          WHERE fm1.ACTIVITY_TYPE IN ('Move In', 'Future Move In')
          AND d.FULL_DATE >= DATEADD(month, -24, DATE_TRUNC('month', CURRENT_DATE))
          AND d.FULL_DATE < DATEADD(month, 1, DATE_TRUNC('month', CURRENT_DATE))
          AND fm1.PLATFORM_SOURCE = 'EDGE'
          GROUP BY 1, 2, 3
          ORDER BY report_date DESC;
