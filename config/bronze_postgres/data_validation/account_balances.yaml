tables:
  account_balances:
    validations:
      data_validation:
        source_table_name: account_balances
        source: postgres
        sourcecolumn: id
        sourcequery: "SELECT\n    COALESCE(CAST(id AS TEXT),'<<NULL>>') AS id,\n \
          \   COALESCE(CAST(CAST(amount AS NUMERIC(38,2)) AS TEXT),'<<NULL>>') AS\
          \ amount,\n    CASE WHEN resolved IS NULL THEN '<<NULL>>' WHEN resolved\
          \ IS TRUE THEN 'TRUE' WHEN resolved IS FALSE THEN 'FALSE' ELSE '<<NULL>>'\
          \ END AS resolved,\n    COALESCE(CAST(created_by_id AS TEXT),'<<NULL>>')\
          \ AS created_by_id,\n    COALESCE(CAST(accountable_id AS TEXT),'<<NULL>>')\
          \ AS accountable_id,\n    COALESCE(TRIM(accountable_type),'<<NULL>>') AS\
          \ accountable_type,\n    COALESCE(CAST(tenant_id AS TEXT),'<<NULL>>') AS\
          \ tenant_id,\n    COALESCE(CAST(facility_id AS TEXT),'<<NULL>>') AS facility_id,\n\
          \    COALESCE(TO_CHAR(created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS created_at,\n    COALESCE(TO_CHAR(updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS updated_at,\n    COALESCE(CAST(ledger_id AS TEXT),'<<NULL>>') AS ledger_id,\n\
          \    COALESCE(TO_CHAR(effective_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS effective_on,\n    COALESCE(UPPER(TRIM(CAST(uuid AS TEXT))),'<<NULL>>')\
          \ AS uuid,\n    COALESCE(TRIM(description),'<<NULL>>') AS description,\n\
          \    COALESCE(TO_CHAR(resolved_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS resolved_on,\n    COALESCE(CAST(CAST(subtotal AS NUMERIC(38,2)) AS\
          \ TEXT),'<<NULL>>') AS subtotal,\n    CASE WHEN calculated_store IS NULL\
          \ THEN '<<NULL>>' ELSE COALESCE('{' || (SELECT STRING_AGG(TO_JSON(h.key::TEXT)\
          \ || ': ' || TO_JSON(h.value::TEXT), ', ' ORDER BY h.key) FROM EACH(calculated_store)\
          \ h) || '}', '{}') END AS calculated_store,\n    COALESCE(TRIM(internal_account_code),'<<NULL>>')\
          \ AS internal_account_code,\n    CASE WHEN deleted IS NULL THEN '<<NULL>>'\
          \ WHEN deleted IS TRUE THEN 'TRUE' WHEN deleted IS FALSE THEN 'FALSE' ELSE\
          \ '<<NULL>>' END AS deleted,\n    COALESCE(TO_CHAR(deleted_on,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS deleted_on,\n    COALESCE(CAST(deleted_by_id\
          \ AS TEXT),'<<NULL>>') AS deleted_by_id,\n    COALESCE(CAST(CAST(amount_paid\
          \ AS NUMERIC(38,2)) AS TEXT),'<<NULL>>') AS amount_paid,\n    COALESCE(TO_CHAR(paid_through_date,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS paid_through_date\nFROM public.account_balances;"
        target_table_name: account_balances
        target: snowflake
        targetcolumn: id
        targetquery: "WITH\nobj_agg_calculated_store AS\n(\n    SELECT\n        _flt.id\
          \ AS id,\n        LISTAGG(\n            CASE\n                WHEN f.key\
          \ IS NULL THEN NULL\n                ELSE\n                    TO_JSON(TO_VARIANT(f.key::VARCHAR))\
          \ || ': ' ||\n                    CASE\n                        WHEN f.value\
          \ IS NULL THEN 'null'\n                        WHEN IS_NULL_VALUE(f.value)\
          \ THEN 'null'\n                        WHEN TYPEOF(f.value) = 'VARCHAR'\
          \ THEN TO_JSON(TO_VARIANT(f.value::VARCHAR))\n                        WHEN\
          \ TYPEOF(f.value) = 'BOOLEAN' THEN LOWER(f.value::VARCHAR)\n           \
          \             WHEN TYPEOF(f.value) IN ('INTEGER','DECIMAL','DOUBLE','REAL','NUMBER')\
          \ THEN f.value::VARCHAR\n                        ELSE TO_JSON(f.value)\n\
          \                    END\n            END, ', ') WITHIN GROUP (ORDER BY\
          \ f.key) AS obj_body\n    FROM DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.account_balances\
          \ AS _flt,\n         TABLE(FLATTEN(INPUT => _flt.calculated_store, RECURSIVE\
          \ => FALSE)) f\n    WHERE _flt._FIVETRAN_ACTIVE = TRUE\n      AND TYPEOF(_flt.calculated_store)\
          \ = 'OBJECT'\n      AND _flt._FIVETRAN_ACTIVE = TRUE\n    GROUP BY _flt.id\n\
          ),\nvariant_calculated_store AS\n(\n    SELECT\n        t.id AS id,\n  \
          \      CASE\n\n    -- ======================================================\n\
          \    -- SQL NULL\n    -- ======================================================\n\
          \n    WHEN t.calculated_store IS NULL\n        THEN '<<NULL>>'\n\n\n   \
          \ -- =====================================================\n    -- JSON\
          \ NULL\n    -- =====================================================\n\n\
          \    WHEN IS_NULL_VALUE(\n        t.calculated_store\n    )\n        THEN\
          \ 'null'\n\n\n    -- =====================================================\n\
          \    -- OBJECT\n    -- =====================================================\n\
          \n    WHEN TYPEOF(\n        t.calculated_store\n    ) = 'OBJECT'\n\n   \
          \     THEN\n\n            CHR(123)\n\n            ||\n\n            COALESCE(COALESCE(obj.obj_body,\
          \ ''), '')\n\n            ||\n\n            CHR(125)\n\n\n    -- =====================================================\n\
          \    -- ARRAY\n    -- =====================================================\n\
          \n    WHEN TYPEOF(\n        t.calculated_store\n    ) = 'ARRAY'\n\n    \
          \    THEN COALESCE(\n\n            TO_JSON(\n                t.calculated_store\n\
          \            ),\n\n            '[]'\n\n        )\n\n\n    -- =====================================================\n\
          \    -- SCALAR\n    -- =====================================================\n\
          \n    ELSE\n\n        COALESCE(\n\n            TO_JSON(\n              \
          \  t.calculated_store\n            ),\n\n            '<<NULL>>'\n\n    \
          \    )\n\nEND AS calculated_store\n    FROM\n        DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.account_balances\
          \ t\n    LEFT JOIN obj_agg_calculated_store obj ON obj.id = t.id\n    WHERE\
          \ t._FIVETRAN_ACTIVE = TRUE\n\n)\nSELECT\n    COALESCE(TO_VARCHAR(t.id),'<<NULL>>')\
          \ AS id,\n    COALESCE(TO_VARCHAR(t.amount),'<<NULL>>') AS amount,\n   \
          \ CASE WHEN t.resolved IS NULL THEN '<<NULL>>' WHEN t.resolved = TRUE THEN\
          \ 'TRUE' WHEN t.resolved = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS resolved,\n\
          \    COALESCE(TO_VARCHAR(t.created_by_id),'<<NULL>>') AS created_by_id,\n\
          \    COALESCE(TO_VARCHAR(t.accountable_id),'<<NULL>>') AS accountable_id,\n\
          \    COALESCE(TRIM(t.accountable_type),'<<NULL>>') AS accountable_type,\n\
          \    COALESCE(TO_VARCHAR(t.tenant_id),'<<NULL>>') AS tenant_id,\n    COALESCE(TO_VARCHAR(t.facility_id),'<<NULL>>')\
          \ AS facility_id,\n    COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS created_at,\n    COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS updated_at,\n    COALESCE(TO_VARCHAR(t.ledger_id),'<<NULL>>') AS ledger_id,\n\
          \    COALESCE(TO_CHAR(t.effective_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS effective_on,\n    COALESCE(TRIM(t.uuid),'<<NULL>>') AS uuid,\n   \
          \ COALESCE(TRIM(t.description),'<<NULL>>') AS description,\n    COALESCE(TO_CHAR(t.resolved_on,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS resolved_on,\n    COALESCE(TO_VARCHAR(t.subtotal),'<<NULL>>')\
          \ AS subtotal,\n    v_calculated_store.calculated_store AS calculated_store,\n\
          \    COALESCE(TRIM(t.internal_account_code),'<<NULL>>') AS internal_account_code,\n\
          \    CASE WHEN t.deleted IS NULL THEN '<<NULL>>' WHEN t.deleted = TRUE THEN\
          \ 'TRUE' WHEN t.deleted = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS deleted,\n\
          \    COALESCE(TO_CHAR(t.deleted_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS deleted_on,\n    COALESCE(TO_VARCHAR(t.deleted_by_id),'<<NULL>>') AS\
          \ deleted_by_id,\n    COALESCE(TO_VARCHAR(t.amount_paid),'<<NULL>>') AS\
          \ amount_paid,\n    COALESCE(TO_CHAR(t.paid_through_date,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS paid_through_date\nFROM variant_calculated_store v_calculated_store\
          \ LEFT JOIN DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.account_balances t ON v_calculated_store.id\
          \ = t.id\nWHERE t._FIVETRAN_ACTIVE = TRUE"
