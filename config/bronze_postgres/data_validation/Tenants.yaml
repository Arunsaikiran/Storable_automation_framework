tables:
  tenants:
    validations:
      data_validation:
        source_table_name: tenants
        source: postgres
        sourcecolumn: id
        sourcequery: "SELECT\n    COALESCE(CAST(id AS TEXT),'<<NULL>>') AS id,\n \
          \   COALESCE(TRIM(first_name),'<<NULL>>') AS first_name,\n    COALESCE(TRIM(last_name),'<<NULL>>')\
          \ AS last_name,\n    COALESCE(TRIM(email),'<<NULL>>') AS email,\n    CASE\
          \ WHEN tax_exempt IS NULL THEN '<<NULL>>' WHEN tax_exempt IS TRUE THEN 'TRUE'\
          \ WHEN tax_exempt IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS tax_exempt,\n\
          \    COALESCE(TRIM(tax_exempt_number),'<<NULL>>') AS tax_exempt_number,\n\
          \    COALESCE(TRIM(drivers_license_number),'<<NULL>>') AS drivers_license_number,\n\
          \    COALESCE(TRIM(drivers_license_state),'<<NULL>>') AS drivers_license_state,\n\
          \    COALESCE(CAST(facility_id AS TEXT),'<<NULL>>') AS facility_id,\n  \
          \  COALESCE(TO_CHAR(created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS created_at,\n    COALESCE(TO_CHAR(updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS updated_at,\n    COALESCE(TRIM(payment_provider_checksum),'<<NULL>>')\
          \ AS payment_provider_checksum,\n    COALESCE(TRIM(business_name),'<<NULL>>')\
          \ AS business_name,\n    COALESCE(TRIM(encrypted_password),'<<NULL>>') AS\
          \ encrypted_password,\n    COALESCE(TRIM(reset_password_token),'<<NULL>>')\
          \ AS reset_password_token,\n    COALESCE(TO_CHAR(reset_password_sent_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS reset_password_sent_at,\n    COALESCE(TO_CHAR(remember_created_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS remember_created_at,\n    COALESCE(CAST(sign_in_count\
          \ AS TEXT),'<<NULL>>') AS sign_in_count,\n    COALESCE(TO_CHAR(current_sign_in_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS current_sign_in_at,\n    COALESCE(TO_CHAR(last_sign_in_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS last_sign_in_at,\n    COALESCE(TRIM(current_sign_in_ip),'<<NULL>>')\
          \ AS current_sign_in_ip,\n    COALESCE(TRIM(last_sign_in_ip),'<<NULL>>')\
          \ AS last_sign_in_ip,\n    COALESCE(TRIM(last_ua),'<<NULL>>') AS last_ua,\n\
          \    COALESCE(TRIM(middle_initial),'<<NULL>>') AS middle_initial,\n    COALESCE(TRIM(title),'<<NULL>>')\
          \ AS title,\n    COALESCE(UPPER(TRIM(CAST(uuid AS TEXT))),'<<NULL>>') AS\
          \ uuid,\n    CASE WHEN gate_vendor_data IS NULL THEN '<<NULL>>' ELSE COALESCE('{'\
          \ || (SELECT STRING_AGG(TO_JSON(h.key::TEXT) || ': ' || TO_JSON(h.value::TEXT),\
          \ ', ' ORDER BY h.key) FROM EACH(gate_vendor_data) h) || '}', '{}') END\
          \ AS gate_vendor_data,\n    CASE WHEN delinquent IS NULL THEN '<<NULL>>'\
          \ WHEN delinquent IS TRUE THEN 'TRUE' WHEN delinquent IS FALSE THEN 'FALSE'\
          \ ELSE '<<NULL>>' END AS delinquent,\n    COALESCE(TRIM(username),'<<NULL>>')\
          \ AS username,\n    CASE WHEN password_expired IS NULL THEN '<<NULL>>' WHEN\
          \ password_expired IS TRUE THEN 'TRUE' WHEN password_expired IS FALSE THEN\
          \ 'FALSE' ELSE '<<NULL>>' END AS password_expired,\n    COALESCE(TRIM(payment_provider_token_enc),'<<NULL>>')\
          \ AS payment_provider_token_enc,\n    COALESCE(TRIM(vehicle_license_plate_number),'<<NULL>>')\
          \ AS vehicle_license_plate_number,\n    COALESCE(TRIM(vehicle_description),'<<NULL>>')\
          \ AS vehicle_description,\n    COALESCE(CAST(primary_contact_id AS TEXT),'<<NULL>>')\
          \ AS primary_contact_id,\n    COALESCE(CAST(primary_phone_number_id AS TEXT),'<<NULL>>')\
          \ AS primary_phone_number_id,\n    COALESCE(TRIM(vehicle_license_state),'<<NULL>>')\
          \ AS vehicle_license_state,\n    COALESCE(CAST(account_number AS TEXT),'<<NULL>>')\
          \ AS account_number,\n    COALESCE(CAST(company_id AS TEXT),'<<NULL>>')\
          \ AS company_id,\n    COALESCE(CAST(tenant_account_kind_id AS TEXT),'<<NULL>>')\
          \ AS tenant_account_kind_id,\n    COALESCE(CAST(confirmation_index AS TEXT),'<<NULL>>')\
          \ AS confirmation_index,\n    CASE WHEN invalid_email IS NULL THEN '<<NULL>>'\
          \ WHEN invalid_email IS TRUE THEN 'TRUE' WHEN invalid_email IS FALSE THEN\
          \ 'FALSE' ELSE '<<NULL>>' END AS invalid_email,\n    COALESCE(TO_CHAR(date_of_birth,'YYYY-MM-DD'),'<<NULL>>')\
          \ AS date_of_birth,\n    COALESCE(TO_CHAR(drivers_license_expiration_date,'YYYY-MM-DD'),'<<NULL>>')\
          \ AS drivers_license_expiration_date,\n    CASE WHEN military_information\
          \ IS NULL THEN '<<NULL>>' ELSE COALESCE('{' || (SELECT STRING_AGG(TO_JSON(h.key::TEXT)\
          \ || ': ' || TO_JSON(h.value::TEXT), ', ' ORDER BY h.key) FROM EACH(military_information)\
          \ h) || '}', '{}') END AS military_information,\n    CASE WHEN blocked_payments\
          \ IS NULL THEN '<<NULL>>' WHEN blocked_payments IS TRUE THEN 'TRUE' WHEN\
          \ blocked_payments IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS blocked_payments,\n\
          \    COALESCE(TRIM(vehicle_make),'<<NULL>>') AS vehicle_make,\n    COALESCE(TRIM(vehicle_model),'<<NULL>>')\
          \ AS vehicle_model,\n    COALESCE(TRIM(vehicle_vin),'<<NULL>>') AS vehicle_vin,\n\
          \    CASE WHEN vehicle_motorized IS NULL THEN '<<NULL>>' WHEN vehicle_motorized\
          \ IS TRUE THEN 'TRUE' WHEN vehicle_motorized IS FALSE THEN 'FALSE' ELSE\
          \ '<<NULL>>' END AS vehicle_motorized,\n    CASE WHEN rental_review IS NULL\
          \ THEN '<<NULL>>' WHEN rental_review IS TRUE THEN 'TRUE' WHEN rental_review\
          \ IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS rental_review,\n    COALESCE(TRIM(rental_review_reason),'<<NULL>>')\
          \ AS rental_review_reason,\n    COALESCE(TRIM(rental_review_remediation),'<<NULL>>')\
          \ AS rental_review_remediation,\n    COALESCE(CAST(primary_tenant_id AS\
          \ TEXT),'<<NULL>>') AS primary_tenant_id,\n    COALESCE(TO_CHAR(archived_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS archived_at\nFROM public.tenants;"
        target_table_name: tenants
        target: snowflake
        targetcolumn: id
        targetquery: "WITH\nobj_agg_gate_vendor_data AS\n(\n    SELECT\n        _flt.id\
          \ AS id,\n        LISTAGG(\n            CASE\n                WHEN f.key\
          \ IS NULL THEN NULL\n                ELSE\n                    TO_JSON(TO_VARIANT(f.key::VARCHAR))\
          \ || ': ' ||\n                    CASE\n                        WHEN f.value\
          \ IS NULL THEN 'null'\n                        WHEN IS_NULL_VALUE(f.value)\
          \ THEN 'null'\n                        WHEN TYPEOF(f.value) = 'VARCHAR'\
          \ THEN TO_JSON(TO_VARIANT(f.value::VARCHAR))\n                        WHEN\
          \ TYPEOF(f.value) = 'BOOLEAN' THEN LOWER(f.value::VARCHAR)\n           \
          \             WHEN TYPEOF(f.value) IN ('INTEGER','DECIMAL','DOUBLE','REAL','NUMBER')\
          \ THEN f.value::VARCHAR\n                        ELSE TO_JSON(f.value)\n\
          \                    END\n            END, ', ') WITHIN GROUP (ORDER BY\
          \ f.key) AS obj_body\n    FROM DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.tenants\
          \ AS _flt,\n         TABLE(FLATTEN(INPUT => _flt.gate_vendor_data, RECURSIVE\
          \ => FALSE)) f\n    WHERE _flt._FIVETRAN_ACTIVE = TRUE\n      AND TYPEOF(_flt.gate_vendor_data)\
          \ = 'OBJECT'\n      AND _flt._FIVETRAN_ACTIVE = TRUE\n    GROUP BY _flt.id\n\
          ),\nvariant_gate_vendor_data AS\n(\n    SELECT\n        t.id AS id,\n  \
          \      CASE\n\n    -- ======================================================\n\
          \    -- SQL NULL\n    -- ======================================================\n\
          \n    WHEN t.gate_vendor_data IS NULL\n        THEN '<<NULL>>'\n\n\n   \
          \ -- =====================================================\n    -- JSON\
          \ NULL\n    -- =====================================================\n\n\
          \    WHEN IS_NULL_VALUE(\n        t.gate_vendor_data\n    )\n        THEN\
          \ 'null'\n\n\n    -- =====================================================\n\
          \    -- OBJECT\n    -- =====================================================\n\
          \n    WHEN TYPEOF(\n        t.gate_vendor_data\n    ) = 'OBJECT'\n\n   \
          \     THEN\n\n            CHR(123)\n\n            ||\n\n            COALESCE(COALESCE(obj.obj_body,\
          \ ''), '')\n\n            ||\n\n            CHR(125)\n\n\n    -- =====================================================\n\
          \    -- ARRAY\n    -- =====================================================\n\
          \n    WHEN TYPEOF(\n        t.gate_vendor_data\n    ) = 'ARRAY'\n\n    \
          \    THEN COALESCE(\n\n            TO_JSON(\n                t.gate_vendor_data\n\
          \            ),\n\n            '[]'\n\n        )\n\n\n    -- =====================================================\n\
          \    -- SCALAR\n    -- =====================================================\n\
          \n    ELSE\n\n        COALESCE(\n\n            TO_JSON(\n              \
          \  t.gate_vendor_data\n            ),\n\n            '<<NULL>>'\n\n    \
          \    )\n\nEND AS gate_vendor_data\n    FROM\n        DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.tenants\
          \ t\n    LEFT JOIN obj_agg_gate_vendor_data obj ON obj.id = t.id\n    WHERE\
          \ t._FIVETRAN_ACTIVE = TRUE\n\n),\nobj_agg_military_information AS\n(\n\
          \    SELECT\n        _flt.id AS id,\n        LISTAGG(\n            CASE\n\
          \                WHEN f.key IS NULL THEN NULL\n                ELSE\n  \
          \                  TO_JSON(TO_VARIANT(f.key::VARCHAR)) || ': ' ||\n    \
          \                CASE\n                        WHEN f.value IS NULL THEN\
          \ 'null'\n                        WHEN IS_NULL_VALUE(f.value) THEN 'null'\n\
          \                        WHEN TYPEOF(f.value) = 'VARCHAR' THEN TO_JSON(TO_VARIANT(f.value::VARCHAR))\n\
          \                        WHEN TYPEOF(f.value) = 'BOOLEAN' THEN LOWER(f.value::VARCHAR)\n\
          \                        WHEN TYPEOF(f.value) IN ('INTEGER','DECIMAL','DOUBLE','REAL','NUMBER')\
          \ THEN f.value::VARCHAR\n                        ELSE TO_JSON(f.value)\n\
          \                    END\n            END, ', ') WITHIN GROUP (ORDER BY\
          \ f.key) AS obj_body\n    FROM DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.tenants\
          \ AS _flt,\n         TABLE(FLATTEN(INPUT => _flt.military_information, RECURSIVE\
          \ => FALSE)) f\n    WHERE _flt._FIVETRAN_ACTIVE = TRUE\n      AND TYPEOF(_flt.military_information)\
          \ = 'OBJECT'\n      AND _flt._FIVETRAN_ACTIVE = TRUE\n    GROUP BY _flt.id\n\
          ),\nvariant_military_information AS\n(\n    SELECT\n        t.id AS id,\n\
          \        CASE\n\n    -- ======================================================\n\
          \    -- SQL NULL\n    -- ======================================================\n\
          \n    WHEN t.military_information IS NULL\n        THEN '<<NULL>>'\n\n\n\
          \    -- =====================================================\n    -- JSON\
          \ NULL\n    -- =====================================================\n\n\
          \    WHEN IS_NULL_VALUE(\n        t.military_information\n    )\n      \
          \  THEN 'null'\n\n\n    -- =====================================================\n\
          \    -- OBJECT\n    -- =====================================================\n\
          \n    WHEN TYPEOF(\n        t.military_information\n    ) = 'OBJECT'\n\n\
          \        THEN\n\n            CHR(123)\n\n            ||\n\n            COALESCE(COALESCE(obj.obj_body,\
          \ ''), '')\n\n            ||\n\n            CHR(125)\n\n\n    -- =====================================================\n\
          \    -- ARRAY\n    -- =====================================================\n\
          \n    WHEN TYPEOF(\n        t.military_information\n    ) = 'ARRAY'\n\n\
          \        THEN COALESCE(\n\n            TO_JSON(\n                t.military_information\n\
          \            ),\n\n            '[]'\n\n        )\n\n\n    -- =====================================================\n\
          \    -- SCALAR\n    -- =====================================================\n\
          \n    ELSE\n\n        COALESCE(\n\n            TO_JSON(\n              \
          \  t.military_information\n            ),\n\n            '<<NULL>>'\n\n\
          \        )\n\nEND AS military_information\n    FROM\n        DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.tenants\
          \ t\n    LEFT JOIN obj_agg_military_information obj ON obj.id = t.id\n \
          \   WHERE t._FIVETRAN_ACTIVE = TRUE\n\n)\nSELECT\n    COALESCE(TO_VARCHAR(t.id),'<<NULL>>')\
          \ AS id,\n    COALESCE(TRIM(t.first_name),'<<NULL>>') AS first_name,\n \
          \   COALESCE(TRIM(t.last_name),'<<NULL>>') AS last_name,\n    COALESCE(TRIM(t.email),'<<NULL>>')\
          \ AS email,\n    CASE WHEN t.tax_exempt IS NULL THEN '<<NULL>>' WHEN t.tax_exempt\
          \ = TRUE THEN 'TRUE' WHEN t.tax_exempt = FALSE THEN 'FALSE' ELSE '<<NULL>>'\
          \ END AS tax_exempt,\n    COALESCE(TRIM(t.tax_exempt_number),'<<NULL>>')\
          \ AS tax_exempt_number,\n    COALESCE(TRIM(t.drivers_license_number),'<<NULL>>')\
          \ AS drivers_license_number,\n    COALESCE(TRIM(t.drivers_license_state),'<<NULL>>')\
          \ AS drivers_license_state,\n    COALESCE(TO_VARCHAR(t.facility_id),'<<NULL>>')\
          \ AS facility_id,\n    COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS created_at,\n    COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS updated_at,\n    COALESCE(TRIM(t.payment_provider_checksum),'<<NULL>>')\
          \ AS payment_provider_checksum,\n    COALESCE(TRIM(t.business_name),'<<NULL>>')\
          \ AS business_name,\n    COALESCE(TRIM(t.encrypted_password),'<<NULL>>')\
          \ AS encrypted_password,\n    COALESCE(TRIM(t.reset_password_token),'<<NULL>>')\
          \ AS reset_password_token,\n    COALESCE(TO_CHAR(t.reset_password_sent_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS reset_password_sent_at,\n    COALESCE(TO_CHAR(t.remember_created_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS remember_created_at,\n    COALESCE(TO_VARCHAR(t.sign_in_count),'<<NULL>>')\
          \ AS sign_in_count,\n    COALESCE(TO_CHAR(t.current_sign_in_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS current_sign_in_at,\n    COALESCE(TO_CHAR(t.last_sign_in_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS last_sign_in_at,\n    COALESCE(TRIM(t.current_sign_in_ip),'<<NULL>>')\
          \ AS current_sign_in_ip,\n    COALESCE(TRIM(t.last_sign_in_ip),'<<NULL>>')\
          \ AS last_sign_in_ip,\n    COALESCE(TRIM(t.last_ua),'<<NULL>>') AS last_ua,\n\
          \    COALESCE(TRIM(t.middle_initial),'<<NULL>>') AS middle_initial,\n  \
          \  COALESCE(TRIM(t.title),'<<NULL>>') AS title,\n    COALESCE(TRIM(t.uuid),'<<NULL>>')\
          \ AS uuid,\n    v_gate_vendor_data.gate_vendor_data AS gate_vendor_data,\n\
          \    CASE WHEN t.delinquent IS NULL THEN '<<NULL>>' WHEN t.delinquent =\
          \ TRUE THEN 'TRUE' WHEN t.delinquent = FALSE THEN 'FALSE' ELSE '<<NULL>>'\
          \ END AS delinquent,\n    COALESCE(TRIM(t.username),'<<NULL>>') AS username,\n\
          \    CASE WHEN t.password_expired IS NULL THEN '<<NULL>>' WHEN t.password_expired\
          \ = TRUE THEN 'TRUE' WHEN t.password_expired = FALSE THEN 'FALSE' ELSE '<<NULL>>'\
          \ END AS password_expired,\n    COALESCE(TRIM(t.payment_provider_token_enc),'<<NULL>>')\
          \ AS payment_provider_token_enc,\n    COALESCE(TRIM(t.vehicle_license_plate_number),'<<NULL>>')\
          \ AS vehicle_license_plate_number,\n    COALESCE(TRIM(t.vehicle_description),'<<NULL>>')\
          \ AS vehicle_description,\n    COALESCE(TO_VARCHAR(t.primary_contact_id),'<<NULL>>')\
          \ AS primary_contact_id,\n    COALESCE(TO_VARCHAR(t.primary_phone_number_id),'<<NULL>>')\
          \ AS primary_phone_number_id,\n    COALESCE(TRIM(t.vehicle_license_state),'<<NULL>>')\
          \ AS vehicle_license_state,\n    COALESCE(TO_VARCHAR(t.account_number),'<<NULL>>')\
          \ AS account_number,\n    COALESCE(TO_VARCHAR(t.company_id),'<<NULL>>')\
          \ AS company_id,\n    COALESCE(TO_VARCHAR(t.tenant_account_kind_id),'<<NULL>>')\
          \ AS tenant_account_kind_id,\n    COALESCE(TO_VARCHAR(t.confirmation_index),'<<NULL>>')\
          \ AS confirmation_index,\n    CASE WHEN t.invalid_email IS NULL THEN '<<NULL>>'\
          \ WHEN t.invalid_email = TRUE THEN 'TRUE' WHEN t.invalid_email = FALSE THEN\
          \ 'FALSE' ELSE '<<NULL>>' END AS invalid_email,\n    COALESCE(TO_CHAR(t.date_of_birth,'YYYY-MM-DD'),'<<NULL>>')\
          \ AS date_of_birth,\n    COALESCE(TO_CHAR(t.drivers_license_expiration_date,'YYYY-MM-DD'),'<<NULL>>')\
          \ AS drivers_license_expiration_date,\n    v_military_information.military_information\
          \ AS military_information,\n    CASE WHEN t.blocked_payments IS NULL THEN\
          \ '<<NULL>>' WHEN t.blocked_payments = TRUE THEN 'TRUE' WHEN t.blocked_payments\
          \ = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS blocked_payments,\n    COALESCE(TRIM(t.vehicle_make),'<<NULL>>')\
          \ AS vehicle_make,\n    COALESCE(TRIM(t.vehicle_model),'<<NULL>>') AS vehicle_model,\n\
          \    COALESCE(TRIM(t.vehicle_vin),'<<NULL>>') AS vehicle_vin,\n    CASE\
          \ WHEN t.vehicle_motorized IS NULL THEN '<<NULL>>' WHEN t.vehicle_motorized\
          \ = TRUE THEN 'TRUE' WHEN t.vehicle_motorized = FALSE THEN 'FALSE' ELSE\
          \ '<<NULL>>' END AS vehicle_motorized,\n    CASE WHEN t.rental_review IS\
          \ NULL THEN '<<NULL>>' WHEN t.rental_review = TRUE THEN 'TRUE' WHEN t.rental_review\
          \ = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS rental_review,\n    COALESCE(TRIM(t.rental_review_reason),'<<NULL>>')\
          \ AS rental_review_reason,\n    COALESCE(TRIM(t.rental_review_remediation),'<<NULL>>')\
          \ AS rental_review_remediation,\n    COALESCE(TO_VARCHAR(t.primary_tenant_id),'<<NULL>>')\
          \ AS primary_tenant_id,\n    COALESCE(TO_CHAR(t.archived_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS archived_at\nFROM variant_military_information\
          \ v_military_information LEFT JOIN variant_gate_vendor_data v_gate_vendor_data\
          \ LEFT JOIN DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.tenants t ON v_gate_vendor_data.id\
          \ = t.id ON v_military_information.id = t.id\nWHERE t._FIVETRAN_ACTIVE =\
          \ TRUE"
