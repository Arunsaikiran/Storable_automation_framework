tables:
  unit_amenities_units:
    validations:
      data_validation:
        source_table_name: unit_amenities_units
        source: postgres
        sourcecolumn: id
        sourcequery: "SELECT\n    COALESCE(CAST(unit_id AS TEXT),'<<NULL>>') AS unit_id,\n\
          \    COALESCE(CAST(unit_amenity_id AS TEXT),'<<NULL>>') AS unit_amenity_id,\n\
          \    COALESCE(CAST(id AS TEXT),'<<NULL>>') AS id,\n    COALESCE(TO_CHAR(created_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,\n    COALESCE(TO_CHAR(updated_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at\nFROM public.unit_amenities_units;"
        target_table_name: unit_amenities_units
        target: snowflake
        targetcolumn: id
        targetquery: "SELECT\n    COALESCE(TO_VARCHAR(t.unit_id),'<<NULL>>') AS unit_id,\n\
          \    COALESCE(TO_VARCHAR(t.unit_amenity_id),'<<NULL>>') AS unit_amenity_id,\n\
          \    COALESCE(TO_VARCHAR(t.id),'<<NULL>>') AS id,\n    COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,\n    COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at\nFROM DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.unit_amenities_units\
          \ t\nWHERE t._FIVETRAN_ACTIVE = TRUE"
