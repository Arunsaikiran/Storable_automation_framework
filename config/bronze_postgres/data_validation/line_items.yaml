tables:
  line_items:
    validations:
      data_validation:
        source_table_name: line_items
        source: postgres
        sourcecolumn: id
        sourcequery: "SELECT\n    COALESCE(CAST(id AS TEXT),'<<NULL>>') AS id,\n \
          \   COALESCE(TRIM(description),'<<NULL>>') AS description,\n    COALESCE(TRIM(product_code),'<<NULL>>')\
          \ AS product_code,\n    COALESCE(CAST(CAST(amount AS NUMERIC(38,2)) AS TEXT),'<<NULL>>')\
          \ AS amount,\n    COALESCE(CAST(quantity AS TEXT),'<<NULL>>') AS quantity,\n\
          \    COALESCE(TO_CHAR(service_start_date,'YYYY-MM-DD'),'<<NULL>>') AS service_start_date,\n\
          \    COALESCE(TO_CHAR(service_end_date,'YYYY-MM-DD'),'<<NULL>>') AS service_end_date,\n\
          \    CASE WHEN locked IS NULL THEN '<<NULL>>' WHEN locked IS TRUE THEN 'TRUE'\
          \ WHEN locked IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS locked,\n   \
          \ COALESCE(TRIM(saved_account_code),'<<NULL>>') AS saved_account_code,\n\
          \    COALESCE(CAST(created_by_id AS TEXT),'<<NULL>>') AS created_by_id,\n\
          \    COALESCE(CAST(invoice_id AS TEXT),'<<NULL>>') AS invoice_id,\n    COALESCE(CAST(invoiceable_id\
          \ AS TEXT),'<<NULL>>') AS invoiceable_id,\n    COALESCE(TRIM(invoiceable_type),'<<NULL>>')\
          \ AS invoiceable_type,\n    COALESCE(CAST(parent_line_item_id AS TEXT),'<<NULL>>')\
          \ AS parent_line_item_id,\n    COALESCE(TO_CHAR(created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS created_at,\n    COALESCE(TO_CHAR(updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS updated_at,\n    COALESCE(UPPER(TRIM(CAST(uuid AS TEXT))),'<<NULL>>')\
          \ AS uuid,\n    COALESCE(CAST(ledger_id AS TEXT),'<<NULL>>') AS ledger_id,\n\
          \    COALESCE(CAST(tenant_id AS TEXT),'<<NULL>>') AS tenant_id,\n    COALESCE(CAST(facility_id\
          \ AS TEXT),'<<NULL>>') AS facility_id,\n    CASE WHEN tax_exempt IS NULL\
          \ THEN '<<NULL>>' WHEN tax_exempt IS TRUE THEN 'TRUE' WHEN tax_exempt IS\
          \ FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS tax_exempt,\n    COALESCE(TRIM(tax_exempt_number),'<<NULL>>')\
          \ AS tax_exempt_number,\n    CASE WHEN modifiers IS NULL THEN '<<NULL>>'\
          \ ELSE COALESCE('{' || (SELECT STRING_AGG(TO_JSON(h.key::TEXT) || ': ' ||\
          \ TO_JSON(h.value::TEXT), ', ' ORDER BY h.key) FROM EACH(modifiers) h) ||\
          \ '}', '{}') END AS modifiers,\n    COALESCE(CAST(original_line_item_id\
          \ AS TEXT),'<<NULL>>') AS original_line_item_id,\n    COALESCE(TRIM(internal_account_code),'<<NULL>>')\
          \ AS internal_account_code,\n    COALESCE(TRIM(internal_accounts_receivable_account_code),'<<NULL>>')\
          \ AS internal_accounts_receivable_account_code\nFROM public.line_items;"
        target_table_name: line_items
        target: snowflake
        targetcolumn: id
        targetquery: "WITH\nobj_agg_modifiers AS\n(\n    SELECT\n        _flt.id AS\
          \ id,\n        LISTAGG(\n            CASE\n                WHEN f.key IS\
          \ NULL THEN NULL\n                ELSE\n                    TO_JSON(TO_VARIANT(f.key::VARCHAR))\
          \ || ': ' ||\n                    CASE\n                        WHEN f.value\
          \ IS NULL THEN 'null'\n                        WHEN IS_NULL_VALUE(f.value)\
          \ THEN 'null'\n                        WHEN TYPEOF(f.value) = 'VARCHAR'\
          \ THEN TO_JSON(TO_VARIANT(f.value::VARCHAR))\n                        WHEN\
          \ TYPEOF(f.value) = 'BOOLEAN' THEN LOWER(f.value::VARCHAR)\n           \
          \             WHEN TYPEOF(f.value) IN ('INTEGER','DECIMAL','DOUBLE','REAL','NUMBER')\
          \ THEN f.value::VARCHAR\n                        ELSE TO_JSON(f.value)\n\
          \                    END\n            END, ', ') WITHIN GROUP (ORDER BY\
          \ f.key) AS obj_body\n    FROM DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.line_items\
          \ AS _flt,\n         TABLE(FLATTEN(INPUT => _flt.modifiers, RECURSIVE =>\
          \ FALSE)) f\n    WHERE _flt._FIVETRAN_ACTIVE = TRUE\n      AND TYPEOF(_flt.modifiers)\
          \ = 'OBJECT'\n      AND _flt._FIVETRAN_ACTIVE = TRUE\n    GROUP BY _flt.id\n\
          ),\nvariant_modifiers AS\n(\n    SELECT\n        t.id AS id,\n        CASE\n\
          \n    -- ======================================================\n    --\
          \ SQL NULL\n    -- ======================================================\n\
          \n    WHEN t.modifiers IS NULL\n        THEN '<<NULL>>'\n\n\n    -- =====================================================\n\
          \    -- JSON NULL\n    -- =====================================================\n\
          \n    WHEN IS_NULL_VALUE(\n        t.modifiers\n    )\n        THEN 'null'\n\
          \n\n    -- =====================================================\n    --\
          \ OBJECT\n    -- =====================================================\n\
          \n    WHEN TYPEOF(\n        t.modifiers\n    ) = 'OBJECT'\n\n        THEN\n\
          \n            CHR(123)\n\n            ||\n\n            COALESCE(COALESCE(obj.obj_body,\
          \ ''), '')\n\n            ||\n\n            CHR(125)\n\n\n    -- =====================================================\n\
          \    -- ARRAY\n    -- =====================================================\n\
          \n    WHEN TYPEOF(\n        t.modifiers\n    ) = 'ARRAY'\n\n        THEN\
          \ COALESCE(\n\n            TO_JSON(\n                t.modifiers\n     \
          \       ),\n\n            '[]'\n\n        )\n\n\n    -- =====================================================\n\
          \    -- SCALAR\n    -- =====================================================\n\
          \n    ELSE\n\n        COALESCE(\n\n            TO_JSON(\n              \
          \  t.modifiers\n            ),\n\n            '<<NULL>>'\n\n        )\n\n\
          END AS modifiers\n    FROM\n        DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.line_items\
          \ t\n    LEFT JOIN obj_agg_modifiers obj ON obj.id = t.id\n    WHERE t._FIVETRAN_ACTIVE\
          \ = TRUE\n\n)\nSELECT\n    COALESCE(TO_VARCHAR(t.id),'<<NULL>>') AS id,\n\
          \    COALESCE(TRIM(t.description),'<<NULL>>') AS description,\n    COALESCE(TRIM(t.product_code),'<<NULL>>')\
          \ AS product_code,\n    COALESCE(TO_VARCHAR(t.amount),'<<NULL>>') AS amount,\n\
          \    COALESCE(TO_VARCHAR(t.quantity),'<<NULL>>') AS quantity,\n    COALESCE(TO_CHAR(t.service_start_date,'YYYY-MM-DD'),'<<NULL>>')\
          \ AS service_start_date,\n    COALESCE(TO_CHAR(t.service_end_date,'YYYY-MM-DD'),'<<NULL>>')\
          \ AS service_end_date,\n    CASE WHEN t.locked IS NULL THEN '<<NULL>>' WHEN\
          \ t.locked = TRUE THEN 'TRUE' WHEN t.locked = FALSE THEN 'FALSE' ELSE '<<NULL>>'\
          \ END AS locked,\n    COALESCE(TRIM(t.saved_account_code),'<<NULL>>') AS\
          \ saved_account_code,\n    COALESCE(TO_VARCHAR(t.created_by_id),'<<NULL>>')\
          \ AS created_by_id,\n    COALESCE(TO_VARCHAR(t.invoice_id),'<<NULL>>') AS\
          \ invoice_id,\n    COALESCE(TO_VARCHAR(t.invoiceable_id),'<<NULL>>') AS\
          \ invoiceable_id,\n    COALESCE(TRIM(t.invoiceable_type),'<<NULL>>') AS\
          \ invoiceable_type,\n    COALESCE(TO_VARCHAR(t.parent_line_item_id),'<<NULL>>')\
          \ AS parent_line_item_id,\n    COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,\n    COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,\n    COALESCE(TRIM(t.uuid),'<<NULL>>')\
          \ AS uuid,\n    COALESCE(TO_VARCHAR(t.ledger_id),'<<NULL>>') AS ledger_id,\n\
          \    COALESCE(TO_VARCHAR(t.tenant_id),'<<NULL>>') AS tenant_id,\n    COALESCE(TO_VARCHAR(t.facility_id),'<<NULL>>')\
          \ AS facility_id,\n    CASE WHEN t.tax_exempt IS NULL THEN '<<NULL>>' WHEN\
          \ t.tax_exempt = TRUE THEN 'TRUE' WHEN t.tax_exempt = FALSE THEN 'FALSE'\
          \ ELSE '<<NULL>>' END AS tax_exempt,\n    COALESCE(TRIM(t.tax_exempt_number),'<<NULL>>')\
          \ AS tax_exempt_number,\n    v_modifiers.modifiers AS modifiers,\n    COALESCE(TO_VARCHAR(t.original_line_item_id),'<<NULL>>')\
          \ AS original_line_item_id,\n    COALESCE(TRIM(t.internal_account_code),'<<NULL>>')\
          \ AS internal_account_code,\n    COALESCE(TRIM(t.internal_accounts_receivable_account_code),'<<NULL>>')\
          \ AS internal_accounts_receivable_account_code\nFROM variant_modifiers v_modifiers\
          \ LEFT JOIN DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.line_items t ON v_modifiers.id\
          \ = t.id\nWHERE t._FIVETRAN_ACTIVE = TRUE"
