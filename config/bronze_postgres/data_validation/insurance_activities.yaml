tables:
  insurance_activities:
    validations:
      data_validation:
        source_table_name: insurance_activities
        source: postgres
        sourcecolumn: id
        sourcequery: |-
          SELECT
              COALESCE(CAST(t.id AS TEXT),'<<NULL>>') AS id,
              COALESCE(CAST(t.facility_id AS TEXT),'<<NULL>>') AS facility_id,
              COALESCE(CAST(t.ledger_id AS TEXT),'<<NULL>>') AS ledger_id,
              COALESCE(CAST(t.ledger_item_id AS TEXT),'<<NULL>>') AS ledger_item_id,
              COALESCE(TRIM(t.action_type),'<<NULL>>') AS action_type,
              COALESCE(TRIM(t.policy_number),'<<NULL>>') AS policy_number,
              COALESCE(CAST(CAST(t.coverage_amount AS NUMERIC(38,2)) AS TEXT),'<<NULL>>') AS coverage_amount,
              COALESCE(CAST(CAST(t.coverage_percentage AS NUMERIC(38,1)) AS TEXT),'<<NULL>>') AS coverage_percentage,
              COALESCE(CAST(CAST(t.premium AS NUMERIC(38,2)) AS TEXT),'<<NULL>>') AS premium,
              COALESCE(TO_CHAR(t.coverage_effective,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS coverage_effective,
              COALESCE(TO_CHAR(t.cancellation_effective,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS cancellation_effective,
              COALESCE(TO_CHAR(t.paid_thru,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS paid_thru,
              COALESCE(CAST(t.source_id AS TEXT),'<<NULL>>') AS source_id,
              COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,
              COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,
              COALESCE(CAST(CAST(t.amount AS NUMERIC(38,2)) AS TEXT),'<<NULL>>') AS amount,
              COALESCE(CAST(CAST(t.retained_fee AS NUMERIC(38,2)) AS TEXT),'<<NULL>>') AS retained_fee,
              COALESCE(CAST(CAST(t.refund_due AS NUMERIC(38,2)) AS TEXT),'<<NULL>>') AS refund_due,
              COALESCE(CAST(CAST(t.refund_paid AS NUMERIC(38,2)) AS TEXT),'<<NULL>>') AS refund_paid,
              CASE WHEN t.deleted IS NULL THEN '<<NULL>>' WHEN t.deleted IS TRUE THEN 'TRUE' WHEN t.deleted IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS deleted,
              COALESCE(UPPER(TRIM(CAST(t.uuid AS TEXT))),'<<NULL>>') AS uuid,
              COALESCE(CAST(t.transaction_id AS TEXT),'<<NULL>>') AS transaction_id,
              COALESCE(TO_CHAR(t.transaction_date,'YYYY-MM-DD'),'<<NULL>>') AS transaction_date,
              COALESCE(TRIM(t.origination),'<<NULL>>') AS origination
          FROM public.insurance_activities t
          JOIN public.facilities f ON t.facility_id = f.id
          WHERE f.company_id IN (137,9088,501) AND t.created_at >= '2025-08-01';
        target_table_name: insurance_activities
        target: snowflake
        targetcolumn: id
        targetquery: |-
          SELECT
              COALESCE(TO_VARCHAR(t.id),'<<NULL>>') AS id,
              COALESCE(TO_VARCHAR(t.facility_id),'<<NULL>>') AS facility_id,
              COALESCE(TO_VARCHAR(t.ledger_id),'<<NULL>>') AS ledger_id,
              COALESCE(TO_VARCHAR(t.ledger_item_id),'<<NULL>>') AS ledger_item_id,
              COALESCE(TRIM(t.action_type),'<<NULL>>') AS action_type,
              COALESCE(TRIM(t.policy_number),'<<NULL>>') AS policy_number,
              COALESCE(TO_VARCHAR(t.coverage_amount),'<<NULL>>') AS coverage_amount,
              COALESCE(TO_VARCHAR(t.coverage_percentage),'<<NULL>>') AS coverage_percentage,
              COALESCE(TO_VARCHAR(t.premium),'<<NULL>>') AS premium,
              COALESCE(TO_CHAR(t.coverage_effective,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS coverage_effective,
              COALESCE(TO_CHAR(t.cancellation_effective,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS cancellation_effective,
              COALESCE(TO_CHAR(t.paid_thru,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS paid_thru,
              COALESCE(TO_VARCHAR(t.source_id),'<<NULL>>') AS source_id,
              COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,
              COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,
              COALESCE(TO_VARCHAR(t.amount),'<<NULL>>') AS amount,
              COALESCE(TO_VARCHAR(t.retained_fee),'<<NULL>>') AS retained_fee,
              COALESCE(TO_VARCHAR(t.refund_due),'<<NULL>>') AS refund_due,
              COALESCE(TO_VARCHAR(t.refund_paid),'<<NULL>>') AS refund_paid,
              CASE WHEN t.deleted IS NULL THEN '<<NULL>>' WHEN t.deleted = TRUE THEN 'TRUE' WHEN t.deleted = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS deleted,
              COALESCE(TRIM(t.uuid),'<<NULL>>') AS uuid,
              COALESCE(TO_VARCHAR(t.transaction_id),'<<NULL>>') AS transaction_id,
              COALESCE(TO_CHAR(t.transaction_date,'YYYY-MM-DD'),'<<NULL>>') AS transaction_date,
              COALESCE(TRIM(t.origination),'<<NULL>>') AS origination
          FROM DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.insurance_activities t
          JOIN DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.facilities f ON t.facility_id = f.id
          WHERE t._FIVETRAN_ACTIVE = TRUE AND f.company_id IN (137,9088,501) AND t.created_at >= '2025-08-01'
