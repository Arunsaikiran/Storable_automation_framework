tables:
  account_balance_items:
    validations:
      data_validation:
        source_table_name: account_balance_items
        source: postgres
        sourcecolumn: id
        sourcequery: |-
          SELECT
              COALESCE(CAST(t.id AS TEXT),'<<NULL>>') AS id,
              COALESCE(CAST(CAST(t.amount AS NUMERIC(38,2)) AS TEXT),'<<NULL>>') AS amount,
              COALESCE(CAST(t.payer_id AS TEXT),'<<NULL>>') AS payer_id,
              COALESCE(CAST(t.payee_id AS TEXT),'<<NULL>>') AS payee_id,
              COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,
              COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,
              COALESCE(UPPER(TRIM(CAST(t.uuid AS TEXT))),'<<NULL>>') AS uuid,
              CASE WHEN t.general_ledger_exempt IS NULL THEN '<<NULL>>' WHEN t.general_ledger_exempt IS TRUE THEN 'TRUE' WHEN t.general_ledger_exempt IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS general_ledger_exempt,
              CASE WHEN t.deleted IS NULL THEN '<<NULL>>' WHEN t.deleted IS TRUE THEN 'TRUE' WHEN t.deleted IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS deleted,
              COALESCE(TO_CHAR(t.deleted_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS deleted_on,
              COALESCE(CAST(t.deleted_by_id AS TEXT),'<<NULL>>') AS deleted_by_id,
              COALESCE(CAST(t.payer_account_balance_tax_id AS TEXT),'<<NULL>>') AS payer_account_balance_tax_id,
              COALESCE(CAST(t.payee_account_balance_tax_id AS TEXT),'<<NULL>>') AS payee_account_balance_tax_id,
              COALESCE(TRIM(t.internal_account_code),'<<NULL>>') AS internal_account_code,
              COALESCE(TRIM(t.internal_payer_account_code),'<<NULL>>') AS internal_payer_account_code
          FROM public.account_balance_items t
          WHERE t.created_at >= '2026-08-01';
        target_table_name: account_balance_items
        target: snowflake
        targetcolumn: id
        targetquery: |-
          SELECT
              COALESCE(TO_VARCHAR(t.id),'<<NULL>>') AS id,
              COALESCE(TO_VARCHAR(t.amount),'<<NULL>>') AS amount,
              COALESCE(TO_VARCHAR(t.payer_id),'<<NULL>>') AS payer_id,
              COALESCE(TO_VARCHAR(t.payee_id),'<<NULL>>') AS payee_id,
              COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,
              COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,
              COALESCE(TRIM(t.uuid),'<<NULL>>') AS uuid,
              CASE WHEN t.general_ledger_exempt IS NULL THEN '<<NULL>>' WHEN t.general_ledger_exempt = TRUE THEN 'TRUE' WHEN t.general_ledger_exempt = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS general_ledger_exempt,
              CASE WHEN t.deleted IS NULL THEN '<<NULL>>' WHEN t.deleted = TRUE THEN 'TRUE' WHEN t.deleted = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS deleted,
              COALESCE(TO_CHAR(t.deleted_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS deleted_on,
              COALESCE(TO_VARCHAR(t.deleted_by_id),'<<NULL>>') AS deleted_by_id,
              COALESCE(TO_VARCHAR(t.payer_account_balance_tax_id),'<<NULL>>') AS payer_account_balance_tax_id,
              COALESCE(TO_VARCHAR(t.payee_account_balance_tax_id),'<<NULL>>') AS payee_account_balance_tax_id,
              COALESCE(TRIM(t.internal_account_code),'<<NULL>>') AS internal_account_code,
              COALESCE(TRIM(t.internal_payer_account_code),'<<NULL>>') AS internal_payer_account_code
          FROM DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.account_balance_items t
          WHERE t._FIVETRAN_ACTIVE = TRUE AND t.created_at >= '2026-08-01'
