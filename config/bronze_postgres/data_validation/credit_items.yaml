tables:
  credit_items:
    validations:
      data_validation:
        source_table_name: credit_items
        source: postgres
        sourcecolumn: id
        sourcequery: |-
          SELECT
              COALESCE(CAST(t.id AS TEXT),'<<NULL>>') AS id,
              COALESCE(CAST(CAST(t.credit_subtotal AS NUMERIC(38,2)) AS TEXT),'<<NULL>>') AS credit_subtotal,
              COALESCE(CAST(t.quantity AS TEXT),'<<NULL>>') AS quantity,
              CASE WHEN t.applied IS NULL THEN '<<NULL>>' WHEN t.applied IS TRUE THEN 'TRUE' WHEN t.applied IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS applied,
              COALESCE(CAST(t.event_id AS TEXT),'<<NULL>>') AS event_id,
              COALESCE(CAST(t.invoiceable_id AS TEXT),'<<NULL>>') AS invoiceable_id,
              COALESCE(TRIM(t.invoiceable_type),'<<NULL>>') AS invoiceable_type,
              COALESCE(CAST(t.ledger_id AS TEXT),'<<NULL>>') AS ledger_id,
              COALESCE(CAST(t.account_balance_id AS TEXT),'<<NULL>>') AS account_balance_id,
              COALESCE(CAST(t.refund_line_item_id AS TEXT),'<<NULL>>') AS refund_line_item_id,
              COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,
              COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,
              COALESCE(UPPER(TRIM(CAST(t.uuid AS TEXT))),'<<NULL>>') AS uuid,
              COALESCE(TO_CHAR(t.applied_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS applied_on,
              COALESCE(CAST(t.user_id AS TEXT),'<<NULL>>') AS user_id,
              COALESCE(CAST(t.originating_event_id AS TEXT),'<<NULL>>') AS originating_event_id,
              COALESCE(TRIM(t.credit_type),'<<NULL>>') AS credit_type,
              COALESCE(CAST(CAST(t.credit_total AS NUMERIC(38,2)) AS TEXT),'<<NULL>>') AS credit_total,
              COALESCE(CAST(CAST(t.retained_credit_amount AS NUMERIC(38,2)) AS TEXT),'<<NULL>>') AS retained_credit_amount,
              CASE WHEN t.data IS NULL THEN '<<NULL>>' ELSE COALESCE('{' || (SELECT STRING_AGG(TO_JSON(h.key::TEXT) || ': ' || TO_JSON(h.value::TEXT), ', ' ORDER BY h.key) FROM EACH(t.data) h) || '}', '{}') END AS data
          FROM public.credit_items t
          WHERE t.created_at >= '2026-08-01';
        target_table_name: credit_items
        target: snowflake
        targetcolumn: id
        targetquery: |-
          WITH
          obj_agg_data AS
          (
              SELECT
                  _flt.id AS id,
                  LISTAGG(
                      CASE
                          WHEN flt_kv.key IS NULL THEN NULL
                          ELSE
                              TO_JSON(TO_VARIANT(flt_kv.key::VARCHAR)) || ': ' ||
                              CASE
                                  WHEN flt_kv.value IS NULL THEN 'null'
                                  WHEN IS_NULL_VALUE(flt_kv.value) THEN 'null'
                                  WHEN TYPEOF(flt_kv.value) = 'VARCHAR' THEN TO_JSON(TO_VARIANT(flt_kv.value::VARCHAR))
                                  WHEN TYPEOF(flt_kv.value) = 'BOOLEAN' THEN LOWER(flt_kv.value::VARCHAR)
                                  WHEN TYPEOF(flt_kv.value) IN ('INTEGER','DECIMAL','DOUBLE','REAL','NUMBER') THEN flt_kv.value::VARCHAR
                                  ELSE TO_JSON(flt_kv.value)
                              END
                      END, ', ') WITHIN GROUP (ORDER BY flt_kv.key) AS obj_body
              FROM {env}_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.credit_items AS _flt
                   , TABLE(FLATTEN(INPUT => _flt.data, RECURSIVE => FALSE)) flt_kv
              WHERE _flt._FIVETRAN_ACTIVE = TRUE
                AND TYPEOF(_flt.data) = 'OBJECT'
                AND _flt._FIVETRAN_ACTIVE = TRUE AND _flt.created_at >= '2026-08-01'
              GROUP BY _flt.id
          ),
          variant_data AS
          (
              SELECT
                  t.id AS id,
                  CASE

              -- ======================================================
              -- SQL NULL
              -- ======================================================

              WHEN t.data IS NULL
                  THEN '<<NULL>>'


              -- =====================================================
              -- JSON NULL
              -- =====================================================

              WHEN IS_NULL_VALUE(
                  t.data
              )
                  THEN 'null'


              -- =====================================================
              -- OBJECT
              -- =====================================================

              WHEN TYPEOF(
                  t.data
              ) = 'OBJECT'

                  THEN

                      CHR(123)

                      ||

                      COALESCE(COALESCE(obj.obj_body, ''), '')

                      ||

                      CHR(125)


              -- =====================================================
              -- ARRAY
              -- =====================================================

              WHEN TYPEOF(
                  t.data
              ) = 'ARRAY'

                  THEN COALESCE(

                      TO_JSON(
                          t.data
                      ),

                      '[]'

                  )


              -- =====================================================
              -- SCALAR
              -- =====================================================

              ELSE

                  COALESCE(

                      TO_JSON(
                          t.data
                      ),

                      '<<NULL>>'

                  )

          END AS data
              FROM
                  {env}_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.credit_items t
              LEFT JOIN obj_agg_data obj ON obj.id = t.id
              WHERE t._FIVETRAN_ACTIVE = TRUE AND t.created_at >= '2026-08-01'

          )
          SELECT
              COALESCE(TO_VARCHAR(t.id),'<<NULL>>') AS id,
              COALESCE(TO_VARCHAR(t.credit_subtotal),'<<NULL>>') AS credit_subtotal,
              COALESCE(TO_VARCHAR(t.quantity),'<<NULL>>') AS quantity,
              CASE WHEN t.applied IS NULL THEN '<<NULL>>' WHEN t.applied = TRUE THEN 'TRUE' WHEN t.applied = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS applied,
              COALESCE(TO_VARCHAR(t.event_id),'<<NULL>>') AS event_id,
              COALESCE(TO_VARCHAR(t.invoiceable_id),'<<NULL>>') AS invoiceable_id,
              COALESCE(TRIM(t.invoiceable_type),'<<NULL>>') AS invoiceable_type,
              COALESCE(TO_VARCHAR(t.ledger_id),'<<NULL>>') AS ledger_id,
              COALESCE(TO_VARCHAR(t.account_balance_id),'<<NULL>>') AS account_balance_id,
              COALESCE(TO_VARCHAR(t.refund_line_item_id),'<<NULL>>') AS refund_line_item_id,
              COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,
              COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,
              COALESCE(TRIM(t.uuid),'<<NULL>>') AS uuid,
              COALESCE(TO_CHAR(t.applied_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS applied_on,
              COALESCE(TO_VARCHAR(t.user_id),'<<NULL>>') AS user_id,
              COALESCE(TO_VARCHAR(t.originating_event_id),'<<NULL>>') AS originating_event_id,
              COALESCE(TRIM(t.credit_type),'<<NULL>>') AS credit_type,
              COALESCE(TO_VARCHAR(t.credit_total),'<<NULL>>') AS credit_total,
              COALESCE(TO_VARCHAR(t.retained_credit_amount),'<<NULL>>') AS retained_credit_amount,
              v_data.data AS data
          FROM variant_data v_data LEFT JOIN {env}_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.credit_items t ON v_data.id = t.id
          WHERE t._FIVETRAN_ACTIVE = TRUE AND t.created_at >= '2026-08-01'
