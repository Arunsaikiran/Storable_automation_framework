tables:
  credit_items:
    validations:
      data_validation:
        source_table_name: credit_items
        source: postgres
        sourcecolumn: id
        sourcequery: "SELECT\n    COALESCE(CAST(id AS TEXT),'<<NULL>>') AS id,\n \
          \   COALESCE(CAST(CAST(credit_subtotal AS NUMERIC(38,2)) AS TEXT),'<<NULL>>')\
          \ AS credit_subtotal,\n    COALESCE(CAST(quantity AS TEXT),'<<NULL>>') AS\
          \ quantity,\n    CASE WHEN applied IS NULL THEN '<<NULL>>' WHEN applied\
          \ IS TRUE THEN 'TRUE' WHEN applied IS FALSE THEN 'FALSE' ELSE '<<NULL>>'\
          \ END AS applied,\n    COALESCE(CAST(event_id AS TEXT),'<<NULL>>') AS event_id,\n\
          \    COALESCE(CAST(invoiceable_id AS TEXT),'<<NULL>>') AS invoiceable_id,\n\
          \    COALESCE(TRIM(invoiceable_type),'<<NULL>>') AS invoiceable_type,\n\
          \    COALESCE(CAST(ledger_id AS TEXT),'<<NULL>>') AS ledger_id,\n    COALESCE(CAST(account_balance_id\
          \ AS TEXT),'<<NULL>>') AS account_balance_id,\n    COALESCE(CAST(refund_line_item_id\
          \ AS TEXT),'<<NULL>>') AS refund_line_item_id,\n    COALESCE(TO_CHAR(created_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,\n    COALESCE(TO_CHAR(updated_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,\n    COALESCE(UPPER(TRIM(CAST(uuid\
          \ AS TEXT))),'<<NULL>>') AS uuid,\n    COALESCE(TO_CHAR(applied_on,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS applied_on,\n    COALESCE(CAST(user_id\
          \ AS TEXT),'<<NULL>>') AS user_id,\n    COALESCE(CAST(originating_event_id\
          \ AS TEXT),'<<NULL>>') AS originating_event_id,\n    COALESCE(TRIM(credit_type),'<<NULL>>')\
          \ AS credit_type,\n    COALESCE(CAST(CAST(credit_total AS NUMERIC(38,2))\
          \ AS TEXT),'<<NULL>>') AS credit_total,\n    COALESCE(CAST(CAST(retained_credit_amount\
          \ AS NUMERIC(38,2)) AS TEXT),'<<NULL>>') AS retained_credit_amount,\n  \
          \  CASE WHEN data IS NULL THEN '<<NULL>>' ELSE COALESCE('{' || (SELECT STRING_AGG(TO_JSON(h.key::TEXT)\
          \ || ': ' || TO_JSON(h.value::TEXT), ', ' ORDER BY h.key) FROM EACH(data)\
          \ h) || '}', '{}') END AS data\nFROM public.credit_items;"
        target_table_name: credit_items
        target: snowflake
        targetcolumn: id
        targetquery: "WITH\nobj_agg_data AS\n(\n    SELECT\n        _flt.id AS id,\n\
          \        LISTAGG(\n            CASE\n                WHEN f.key IS NULL\
          \ THEN NULL\n                ELSE\n                    TO_JSON(TO_VARIANT(f.key::VARCHAR))\
          \ || ': ' ||\n                    CASE\n                        WHEN f.value\
          \ IS NULL THEN 'null'\n                        WHEN IS_NULL_VALUE(f.value)\
          \ THEN 'null'\n                        WHEN TYPEOF(f.value) = 'VARCHAR'\
          \ THEN TO_JSON(TO_VARIANT(f.value::VARCHAR))\n                        WHEN\
          \ TYPEOF(f.value) = 'BOOLEAN' THEN LOWER(f.value::VARCHAR)\n           \
          \             WHEN TYPEOF(f.value) IN ('INTEGER','DECIMAL','DOUBLE','REAL','NUMBER')\
          \ THEN f.value::VARCHAR\n                        ELSE TO_JSON(f.value)\n\
          \                    END\n            END, ', ') WITHIN GROUP (ORDER BY\
          \ f.key) AS obj_body\n    FROM DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.credit_items\
          \ AS _flt,\n         TABLE(FLATTEN(INPUT => _flt.data, RECURSIVE => FALSE))\
          \ f\n    WHERE _flt._FIVETRAN_ACTIVE = TRUE\n      AND TYPEOF(_flt.data)\
          \ = 'OBJECT'\n      AND _flt._FIVETRAN_ACTIVE = TRUE\n    GROUP BY _flt.id\n\
          ),\nvariant_data AS\n(\n    SELECT\n        t.id AS id,\n        CASE\n\n\
          \    -- ======================================================\n    -- SQL\
          \ NULL\n    -- ======================================================\n\n\
          \    WHEN t.data IS NULL\n        THEN '<<NULL>>'\n\n\n    -- =====================================================\n\
          \    -- JSON NULL\n    -- =====================================================\n\
          \n    WHEN IS_NULL_VALUE(\n        t.data\n    )\n        THEN 'null'\n\n\
          \n    -- =====================================================\n    -- OBJECT\n\
          \    -- =====================================================\n\n    WHEN\
          \ TYPEOF(\n        t.data\n    ) = 'OBJECT'\n\n        THEN\n\n        \
          \    CHR(123)\n\n            ||\n\n            COALESCE(COALESCE(obj.obj_body,\
          \ ''), '')\n\n            ||\n\n            CHR(125)\n\n\n    -- =====================================================\n\
          \    -- ARRAY\n    -- =====================================================\n\
          \n    WHEN TYPEOF(\n        t.data\n    ) = 'ARRAY'\n\n        THEN COALESCE(\n\
          \n            TO_JSON(\n                t.data\n            ),\n\n     \
          \       '[]'\n\n        )\n\n\n    -- =====================================================\n\
          \    -- SCALAR\n    -- =====================================================\n\
          \n    ELSE\n\n        COALESCE(\n\n            TO_JSON(\n              \
          \  t.data\n            ),\n\n            '<<NULL>>'\n\n        )\n\nEND\
          \ AS data\n    FROM\n        DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.credit_items\
          \ t\n    LEFT JOIN obj_agg_data obj ON obj.id = t.id\n    WHERE t._FIVETRAN_ACTIVE\
          \ = TRUE\n\n)\nSELECT\n    COALESCE(TO_VARCHAR(t.id),'<<NULL>>') AS id,\n\
          \    COALESCE(TO_VARCHAR(t.credit_subtotal),'<<NULL>>') AS credit_subtotal,\n\
          \    COALESCE(TO_VARCHAR(t.quantity),'<<NULL>>') AS quantity,\n    CASE\
          \ WHEN t.applied IS NULL THEN '<<NULL>>' WHEN t.applied = TRUE THEN 'TRUE'\
          \ WHEN t.applied = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS applied,\n\
          \    COALESCE(TO_VARCHAR(t.event_id),'<<NULL>>') AS event_id,\n    COALESCE(TO_VARCHAR(t.invoiceable_id),'<<NULL>>')\
          \ AS invoiceable_id,\n    COALESCE(TRIM(t.invoiceable_type),'<<NULL>>')\
          \ AS invoiceable_type,\n    COALESCE(TO_VARCHAR(t.ledger_id),'<<NULL>>')\
          \ AS ledger_id,\n    COALESCE(TO_VARCHAR(t.account_balance_id),'<<NULL>>')\
          \ AS account_balance_id,\n    COALESCE(TO_VARCHAR(t.refund_line_item_id),'<<NULL>>')\
          \ AS refund_line_item_id,\n    COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,\n    COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,\n    COALESCE(TRIM(t.uuid),'<<NULL>>')\
          \ AS uuid,\n    COALESCE(TO_CHAR(t.applied_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS applied_on,\n    COALESCE(TO_VARCHAR(t.user_id),'<<NULL>>') AS user_id,\n\
          \    COALESCE(TO_VARCHAR(t.originating_event_id),'<<NULL>>') AS originating_event_id,\n\
          \    COALESCE(TRIM(t.credit_type),'<<NULL>>') AS credit_type,\n    COALESCE(TO_VARCHAR(t.credit_total),'<<NULL>>')\
          \ AS credit_total,\n    COALESCE(TO_VARCHAR(t.retained_credit_amount),'<<NULL>>')\
          \ AS retained_credit_amount,\n    v_data.data AS data\nFROM variant_data\
          \ v_data LEFT JOIN DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.credit_items t ON\
          \ v_data.id = t.id\nWHERE t._FIVETRAN_ACTIVE = TRUE"
