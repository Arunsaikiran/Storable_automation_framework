tables:
  unit_groups:
    validations:
      data_validation:
        source_table_name: unit_groups
        source: postgres
        sourcecolumn: id
        sourcequery: |-
          SELECT
              COALESCE(CAST(id AS TEXT),'<<NULL>>') AS id,
              COALESCE(CAST(total_units_count AS TEXT),'<<NULL>>') AS total_units_count,
              COALESCE(CAST(available_units_count AS TEXT),'<<NULL>>') AS available_units_count,
              COALESCE(TRIM(size),'<<NULL>>') AS size,
              COALESCE(CAST(CAST(price AS NUMERIC(38,2)) AS TEXT),'<<NULL>>') AS price,
              COALESCE(CAST(floor AS TEXT),'<<NULL>>') AS floor,
              COALESCE(TRIM(group_key),'<<NULL>>') AS group_key,
              COALESCE(TO_CHAR(created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,
              COALESCE(TO_CHAR(updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,
              COALESCE(UPPER(TRIM(CAST(uuid AS TEXT))),'<<NULL>>') AS uuid,
              COALESCE(CAST(facility_id AS TEXT),'<<NULL>>') AS facility_id,
              COALESCE(CAST(unit_type_id AS TEXT),'<<NULL>>') AS unit_type_id,
              COALESCE(CAST(occupied_units_count AS TEXT),'<<NULL>>') AS occupied_units_count,
              COALESCE(CAST(total_non_excluded_units_count AS TEXT),'<<NULL>>') AS total_non_excluded_units_count,
              COALESCE(CAST(cross_sell_group_id AS TEXT),'<<NULL>>') AS cross_sell_group_id,
              COALESCE(TRIM(justification),'<<NULL>>') AS justification,
              COALESCE(CAST(CAST(managed_rate AS NUMERIC(38,2)) AS TEXT),'<<NULL>>') AS managed_rate,
              COALESCE(CAST(CAST(standard_rate AS NUMERIC(38,2)) AS TEXT),'<<NULL>>') AS standard_rate,
              COALESCE(TRIM(attribute_description),'<<NULL>>') AS attribute_description,
              COALESCE(TRIM(access_type),'<<NULL>>') AS access_type,
              COALESCE(CAST(door_width AS TEXT),'<<NULL>>') AS door_width,
              COALESCE(CAST(door_height AS TEXT),'<<NULL>>') AS door_height,
              COALESCE(CAST(width AS TEXT),'<<NULL>>') AS width,
              COALESCE(CAST(height AS TEXT),'<<NULL>>') AS height,
              COALESCE(CAST(length AS TEXT),'<<NULL>>') AS length,
              COALESCE(CAST(area AS TEXT),'<<NULL>>') AS area,
              COALESCE(CAST(unoccupied_rate_plan_id AS TEXT),'<<NULL>>') AS unoccupied_rate_plan_id,
              CASE WHEN fully_enclosed IS NULL THEN '<<NULL>>' WHEN fully_enclosed IS TRUE THEN 'TRUE' WHEN fully_enclosed IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS fully_enclosed,
              COALESCE(TRIM(name),'<<NULL>>') AS name,
              COALESCE(UPPER(TRIM(CAST(reference_unit_id AS TEXT))),'<<NULL>>') AS reference_unit_id,
              COALESCE(CAST(CAST(max_rate AS NUMERIC(38,2)) AS TEXT),'<<NULL>>') AS max_rate
          FROM public.unit_groups
          ;
        target_table_name: unit_groups
        target: snowflake
        targetcolumn: id
        targetquery: |-
          SELECT
              COALESCE(TO_VARCHAR(t.id),'<<NULL>>') AS id,
              COALESCE(TO_VARCHAR(t.total_units_count),'<<NULL>>') AS total_units_count,
              COALESCE(TO_VARCHAR(t.available_units_count),'<<NULL>>') AS available_units_count,
              COALESCE(TRIM(t.size),'<<NULL>>') AS size,
              COALESCE(TO_VARCHAR(t.price),'<<NULL>>') AS price,
              COALESCE(TO_VARCHAR(t.floor),'<<NULL>>') AS floor,
              COALESCE(TRIM(t.group_key),'<<NULL>>') AS group_key,
              COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,
              COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,
              COALESCE(TRIM(t.uuid),'<<NULL>>') AS uuid,
              COALESCE(TO_VARCHAR(t.facility_id),'<<NULL>>') AS facility_id,
              COALESCE(TO_VARCHAR(t.unit_type_id),'<<NULL>>') AS unit_type_id,
              COALESCE(TO_VARCHAR(t.occupied_units_count),'<<NULL>>') AS occupied_units_count,
              COALESCE(TO_VARCHAR(t.total_non_excluded_units_count),'<<NULL>>') AS total_non_excluded_units_count,
              COALESCE(TO_VARCHAR(t.cross_sell_group_id),'<<NULL>>') AS cross_sell_group_id,
              COALESCE(TRIM(t.justification),'<<NULL>>') AS justification,
              COALESCE(TO_VARCHAR(t.managed_rate),'<<NULL>>') AS managed_rate,
              COALESCE(TO_VARCHAR(t.standard_rate),'<<NULL>>') AS standard_rate,
              COALESCE(TRIM(t.attribute_description),'<<NULL>>') AS attribute_description,
              COALESCE(TRIM(t.access_type),'<<NULL>>') AS access_type,
              COALESCE(TO_VARCHAR(t.door_width),'<<NULL>>') AS door_width,
              COALESCE(TO_VARCHAR(t.door_height),'<<NULL>>') AS door_height,
              COALESCE(TO_VARCHAR(t.width),'<<NULL>>') AS width,
              COALESCE(TO_VARCHAR(t.height),'<<NULL>>') AS height,
              COALESCE(TO_VARCHAR(t.length),'<<NULL>>') AS length,
              COALESCE(TO_VARCHAR(t.area),'<<NULL>>') AS area,
              COALESCE(TO_VARCHAR(t.unoccupied_rate_plan_id),'<<NULL>>') AS unoccupied_rate_plan_id,
              CASE WHEN t.fully_enclosed IS NULL THEN '<<NULL>>' WHEN t.fully_enclosed = TRUE THEN 'TRUE' WHEN t.fully_enclosed = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS fully_enclosed,
              COALESCE(TRIM(t.name),'<<NULL>>') AS name,
              COALESCE(TRIM(t.reference_unit_id),'<<NULL>>') AS reference_unit_id,
              COALESCE(TO_VARCHAR(t.max_rate),'<<NULL>>') AS max_rate
          FROM DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.unit_groups t
          WHERE t._FIVETRAN_ACTIVE = TRUE
