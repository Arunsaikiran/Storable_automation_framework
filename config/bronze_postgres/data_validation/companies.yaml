tables:
  companies:
    validations:
      data_validation:
        source_table_name: companies
        source: postgres
        sourcecolumn: id
        sourcequery: |-
          SELECT
              COALESCE(CAST(id AS TEXT),'<<NULL>>') AS id,
              COALESCE(TRIM(name),'<<NULL>>') AS name,
              COALESCE(TO_CHAR(created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,
              COALESCE(TO_CHAR(updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,
              COALESCE(TRIM(payment_provider_name),'<<NULL>>') AS payment_provider_name,
              CASE WHEN payment_provider_data IS NULL THEN '<<NULL>>' ELSE COALESCE('{' || (SELECT STRING_AGG(TO_JSON(h.key::TEXT) || ': ' || TO_JSON(h.value::TEXT), ', ' ORDER BY h.key) FROM EACH(payment_provider_data) h) || '}', '{}') END AS payment_provider_data,
              COALESCE(UPPER(TRIM(CAST(uuid AS TEXT))),'<<NULL>>') AS uuid,
              COALESCE(CAST(customer_number AS TEXT),'<<NULL>>') AS customer_number,
              COALESCE(TO_CHAR(customer_since,'YYYY-MM-DD'),'<<NULL>>') AS customer_since,
              COALESCE(TRIM(contact_first),'<<NULL>>') AS contact_first,
              COALESCE(TRIM(contact_last),'<<NULL>>') AS contact_last,
              COALESCE(TRIM(contact_email),'<<NULL>>') AS contact_email,
              COALESCE(TRIM(notes),'<<NULL>>') AS notes,
              COALESCE(TRIM(contact_phone),'<<NULL>>') AS contact_phone,
              COALESCE(TRIM(business_phone),'<<NULL>>') AS business_phone,
              CASE WHEN deleted IS NULL THEN '<<NULL>>' WHEN deleted IS TRUE THEN 'TRUE' WHEN deleted IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS deleted,
              COALESCE(TO_CHAR(deleted_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS deleted_on,
              COALESCE(CAST(deleted_by_id AS TEXT),'<<NULL>>') AS deleted_by_id,
              CASE WHEN data IS NULL THEN '<<NULL>>' ELSE COALESCE('{' || (SELECT STRING_AGG(TO_JSON(h.key::TEXT) || ': ' || TO_JSON(h.value::TEXT), ', ' ORDER BY h.key) FROM EACH(data) h) || '}', '{}') END AS data,
              COALESCE(ARRAY_TO_JSON(tags)::TEXT,'<<NULL>>') AS tags,
              COALESCE(TRIM(software_provider),'<<NULL>>') AS software_provider,
              COALESCE(TRIM(salesforce_account_id),'<<NULL>>') AS salesforce_account_id
          FROM public.companies
          ;
        target_table_name: companies
        target: snowflake
        targetcolumn: id
        targetquery: |-
          WITH
          obj_agg_payment_provider_data AS
          (
              SELECT
                  _flt.id AS id,
                  LISTAGG(
                      CASE
                          WHEN flt_kv.key IS NULL THEN NULL
                          ELSE
                              TO_JSON(TO_VARIANT(flt_kv.key::VARCHAR)) || ': ' ||
                              CASE
                                  WHEN flt_kv.value IS NULL THEN 'null'
                                  WHEN IS_NULL_VALUE(flt_kv.value) THEN 'null'
                                  WHEN TYPEOF(flt_kv.value) = 'VARCHAR' THEN TO_JSON(TO_VARIANT(flt_kv.value::VARCHAR))
                                  WHEN TYPEOF(flt_kv.value) = 'BOOLEAN' THEN LOWER(flt_kv.value::VARCHAR)
                                  WHEN TYPEOF(flt_kv.value) IN ('INTEGER','DECIMAL','DOUBLE','REAL','NUMBER') THEN flt_kv.value::VARCHAR
                                  ELSE TO_JSON(flt_kv.value)
                              END
                      END, ', ') WITHIN GROUP (ORDER BY flt_kv.key) AS obj_body
              FROM {env}_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.companies AS _flt
                   , TABLE(FLATTEN(INPUT => _flt.payment_provider_data, RECURSIVE => FALSE)) flt_kv
              WHERE _flt._FIVETRAN_ACTIVE = TRUE
                AND TYPEOF(_flt.payment_provider_data) = 'OBJECT'
                AND _flt._FIVETRAN_ACTIVE = TRUE
              GROUP BY _flt.id
          ),
          variant_payment_provider_data AS
          (
              SELECT
                  t.id AS id,
                  CASE

              -- ======================================================
              -- SQL NULL
              -- ======================================================

              WHEN t.payment_provider_data IS NULL
                  THEN '<<NULL>>'


              -- =====================================================
              -- JSON NULL
              -- =====================================================

              WHEN IS_NULL_VALUE(
                  t.payment_provider_data
              )
                  THEN 'null'


              -- =====================================================
              -- OBJECT
              -- =====================================================

              WHEN TYPEOF(
                  t.payment_provider_data
              ) = 'OBJECT'

                  THEN

                      CHR(123)

                      ||

                      COALESCE(COALESCE(obj.obj_body, ''), '')

                      ||

                      CHR(125)


              -- =====================================================
              -- ARRAY
              -- =====================================================

              WHEN TYPEOF(
                  t.payment_provider_data
              ) = 'ARRAY'

                  THEN COALESCE(

                      TO_JSON(
                          t.payment_provider_data
                      ),

                      '[]'

                  )


              -- =====================================================
              -- SCALAR
              -- =====================================================

              ELSE

                  COALESCE(

                      TO_JSON(
                          t.payment_provider_data
                      ),

                      '<<NULL>>'

                  )

          END AS payment_provider_data
              FROM
                  {env}_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.companies t
              LEFT JOIN obj_agg_payment_provider_data obj ON obj.id = t.id
              WHERE t._FIVETRAN_ACTIVE = TRUE

          ),
          obj_agg_data AS
          (
              SELECT
                  _flt.id AS id,
                  LISTAGG(
                      CASE
                          WHEN flt_kv.key IS NULL THEN NULL
                          ELSE
                              TO_JSON(TO_VARIANT(flt_kv.key::VARCHAR)) || ': ' ||
                              CASE
                                  WHEN flt_kv.value IS NULL THEN 'null'
                                  WHEN IS_NULL_VALUE(flt_kv.value) THEN 'null'
                                  WHEN TYPEOF(flt_kv.value) = 'VARCHAR' THEN TO_JSON(TO_VARIANT(flt_kv.value::VARCHAR))
                                  WHEN TYPEOF(flt_kv.value) = 'BOOLEAN' THEN LOWER(flt_kv.value::VARCHAR)
                                  WHEN TYPEOF(flt_kv.value) IN ('INTEGER','DECIMAL','DOUBLE','REAL','NUMBER') THEN flt_kv.value::VARCHAR
                                  ELSE TO_JSON(flt_kv.value)
                              END
                      END, ', ') WITHIN GROUP (ORDER BY flt_kv.key) AS obj_body
              FROM {env}_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.companies AS _flt
                   , TABLE(FLATTEN(INPUT => _flt.data, RECURSIVE => FALSE)) flt_kv
              WHERE _flt._FIVETRAN_ACTIVE = TRUE
                AND TYPEOF(_flt.data) = 'OBJECT'
                AND _flt._FIVETRAN_ACTIVE = TRUE
              GROUP BY _flt.id
          ),
          variant_data AS
          (
              SELECT
                  t.id AS id,
                  CASE

              -- ======================================================
              -- SQL NULL
              -- ======================================================

              WHEN t.data IS NULL
                  THEN '<<NULL>>'


              -- =====================================================
              -- JSON NULL
              -- =====================================================

              WHEN IS_NULL_VALUE(
                  t.data
              )
                  THEN 'null'


              -- =====================================================
              -- OBJECT
              -- =====================================================

              WHEN TYPEOF(
                  t.data
              ) = 'OBJECT'

                  THEN

                      CHR(123)

                      ||

                      COALESCE(COALESCE(obj.obj_body, ''), '')

                      ||

                      CHR(125)


              -- =====================================================
              -- ARRAY
              -- =====================================================

              WHEN TYPEOF(
                  t.data
              ) = 'ARRAY'

                  THEN COALESCE(

                      TO_JSON(
                          t.data
                      ),

                      '[]'

                  )


              -- =====================================================
              -- SCALAR
              -- =====================================================

              ELSE

                  COALESCE(

                      TO_JSON(
                          t.data
                      ),

                      '<<NULL>>'

                  )

          END AS data
              FROM
                  {env}_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.companies t
              LEFT JOIN obj_agg_data obj ON obj.id = t.id
              WHERE t._FIVETRAN_ACTIVE = TRUE

          ),
          obj_agg_tags AS
          (
              SELECT
                  _flt.id AS id,
                  LISTAGG(
                      CASE
                          WHEN flt_kv.key IS NULL THEN NULL
                          ELSE
                              TO_JSON(TO_VARIANT(flt_kv.key::VARCHAR)) || ': ' ||
                              CASE
                                  WHEN flt_kv.value IS NULL THEN 'null'
                                  WHEN IS_NULL_VALUE(flt_kv.value) THEN 'null'
                                  WHEN TYPEOF(flt_kv.value) = 'VARCHAR' THEN TO_JSON(TO_VARIANT(flt_kv.value::VARCHAR))
                                  WHEN TYPEOF(flt_kv.value) = 'BOOLEAN' THEN LOWER(flt_kv.value::VARCHAR)
                                  WHEN TYPEOF(flt_kv.value) IN ('INTEGER','DECIMAL','DOUBLE','REAL','NUMBER') THEN flt_kv.value::VARCHAR
                                  ELSE TO_JSON(flt_kv.value)
                              END
                      END, ', ') WITHIN GROUP (ORDER BY flt_kv.key) AS obj_body
              FROM {env}_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.companies AS _flt
                   , TABLE(FLATTEN(INPUT => _flt.tags, RECURSIVE => FALSE)) flt_kv
              WHERE _flt._FIVETRAN_ACTIVE = TRUE
                AND TYPEOF(_flt.tags) = 'OBJECT'
                AND _flt._FIVETRAN_ACTIVE = TRUE
              GROUP BY _flt.id
          ),
          variant_tags AS
          (
              SELECT
                  t.id AS id,
                  CASE

              -- ======================================================
              -- SQL NULL
              -- ======================================================

              WHEN t.tags IS NULL
                  THEN '<<NULL>>'


              -- =====================================================
              -- JSON NULL
              -- =====================================================

              WHEN IS_NULL_VALUE(
                  t.tags
              )
                  THEN 'null'


              -- =====================================================
              -- OBJECT
              -- =====================================================

              WHEN TYPEOF(
                  t.tags
              ) = 'OBJECT'

                  THEN

                      CHR(123)

                      ||

                      COALESCE(COALESCE(obj.obj_body, ''), '')

                      ||

                      CHR(125)


              -- =====================================================
              -- ARRAY
              -- =====================================================

              WHEN TYPEOF(
                  t.tags
              ) = 'ARRAY'

                  THEN COALESCE(

                      TO_JSON(
                          t.tags
                      ),

                      '[]'

                  )


              -- =====================================================
              -- SCALAR
              -- =====================================================

              ELSE

                  COALESCE(

                      TO_JSON(
                          t.tags
                      ),

                      '<<NULL>>'

                  )

          END AS tags
              FROM
                  {env}_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.companies t
              LEFT JOIN obj_agg_tags obj ON obj.id = t.id
              WHERE t._FIVETRAN_ACTIVE = TRUE

          )
          SELECT
              COALESCE(TO_VARCHAR(t.id),'<<NULL>>') AS id,
              COALESCE(TRIM(t.name),'<<NULL>>') AS name,
              COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,
              COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,
              COALESCE(TRIM(t.payment_provider_name),'<<NULL>>') AS payment_provider_name,
              v_payment_provider_data.payment_provider_data AS payment_provider_data,
              COALESCE(TRIM(t.uuid),'<<NULL>>') AS uuid,
              COALESCE(TO_VARCHAR(t.customer_number),'<<NULL>>') AS customer_number,
              COALESCE(TO_CHAR(t.customer_since,'YYYY-MM-DD'),'<<NULL>>') AS customer_since,
              COALESCE(TRIM(t.contact_first),'<<NULL>>') AS contact_first,
              COALESCE(TRIM(t.contact_last),'<<NULL>>') AS contact_last,
              COALESCE(TRIM(t.contact_email),'<<NULL>>') AS contact_email,
              COALESCE(TRIM(t.notes),'<<NULL>>') AS notes,
              COALESCE(TRIM(t.contact_phone),'<<NULL>>') AS contact_phone,
              COALESCE(TRIM(t.business_phone),'<<NULL>>') AS business_phone,
              CASE WHEN t.deleted IS NULL THEN '<<NULL>>' WHEN t.deleted = TRUE THEN 'TRUE' WHEN t.deleted = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS deleted,
              COALESCE(TO_CHAR(t.deleted_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS deleted_on,
              COALESCE(TO_VARCHAR(t.deleted_by_id),'<<NULL>>') AS deleted_by_id,
              v_data.data AS data,
              v_tags.tags AS tags,
              COALESCE(TRIM(t.software_provider),'<<NULL>>') AS software_provider,
              COALESCE(TRIM(t.salesforce_account_id),'<<NULL>>') AS salesforce_account_id
          FROM variant_tags v_tags LEFT JOIN variant_data v_data LEFT JOIN variant_payment_provider_data v_payment_provider_data LEFT JOIN {env}_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.companies t ON v_payment_provider_data.id = t.id ON v_data.id = t.id ON v_tags.id = t.id
          WHERE t._FIVETRAN_ACTIVE = TRUE
