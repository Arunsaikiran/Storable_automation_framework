tables:
  change_logged_events:
    validations:
      data_validation:
        source_table_name: change_logged_events
        source: postgres
        sourcecolumn: id
        sourcequery: |-
          SELECT
              COALESCE(CAST(t.id AS TEXT),'<<NULL>>') AS id,
              CASE WHEN t.data IS NULL THEN '<<NULL>>' ELSE COALESCE('{' || (SELECT STRING_AGG(TO_JSON(h.key::TEXT) || ': ' || TO_JSON(h.value::TEXT), ', ' ORDER BY h.key) FROM EACH(t.data) h) || '}', '{}') END AS data,
              COALESCE(CAST(t.source_id AS TEXT),'<<NULL>>') AS source_id,
              COALESCE(CAST(t.tenant_id AS TEXT),'<<NULL>>') AS tenant_id,
              COALESCE(CAST(t.facility_id AS TEXT),'<<NULL>>') AS facility_id,
              COALESCE(CAST(t.unit_id AS TEXT),'<<NULL>>') AS unit_id,
              COALESCE(CAST(t.related_object_id AS TEXT),'<<NULL>>') AS related_object_id,
              COALESCE(TRIM(t.related_object_type),'<<NULL>>') AS related_object_type,
              COALESCE(CAST(t.created_by_id AS TEXT),'<<NULL>>') AS created_by_id,
              COALESCE(TRIM(t.created_by_type),'<<NULL>>') AS created_by_type,
              CASE WHEN t.resolved IS NULL THEN '<<NULL>>' WHEN t.resolved IS TRUE THEN 'TRUE' WHEN t.resolved IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS resolved,
              COALESCE(TO_CHAR(t.resolved_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS resolved_on,
              COALESCE(UPPER(TRIM(CAST(t.uuid AS TEXT))),'<<NULL>>') AS uuid,
              COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,
              COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,
              CASE WHEN t.needs_followup IS NULL THEN '<<NULL>>' WHEN t.needs_followup IS TRUE THEN 'TRUE' WHEN t.needs_followup IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS needs_followup,
              COALESCE(TO_CHAR(t.needs_followup_by,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS needs_followup_by,
              COALESCE(UPPER(TRIM(CAST(t.company_uuid AS TEXT))),'<<NULL>>') AS company_uuid,
              COALESCE(UPPER(TRIM(CAST(t.facility_uuid AS TEXT))),'<<NULL>>') AS facility_uuid,
              COALESCE(UPPER(TRIM(CAST(t.tenant_uuid AS TEXT))),'<<NULL>>') AS tenant_uuid,
              COALESCE(UPPER(TRIM(CAST(t.ledger_uuid AS TEXT))),'<<NULL>>') AS ledger_uuid,
              COALESCE(UPPER(TRIM(CAST(t.unit_uuid AS TEXT))),'<<NULL>>') AS unit_uuid,
              COALESCE(UPPER(TRIM(CAST(t.lead_uuid AS TEXT))),'<<NULL>>') AS lead_uuid,
              COALESCE(UPPER(TRIM(CAST(t.related_object_uuid AS TEXT))),'<<NULL>>') AS related_object_uuid
          FROM public.change_logged_events t
          JOIN public.facilities f ON t.facility_id = f.id
          WHERE f.company_id IN (137,9088,501) AND t.created_at >= '2024-08-01';
        target_table_name: change_logged_events
        target: snowflake
        targetcolumn: id
        targetquery: |-
          WITH
          obj_agg_data AS
          (
              SELECT
                  _flt.id AS id,
                  LISTAGG(
                      CASE
                          WHEN flt_kv.key IS NULL THEN NULL
                          ELSE
                              TO_JSON(TO_VARIANT(flt_kv.key::VARCHAR)) || ': ' ||
                              CASE
                                  WHEN flt_kv.value IS NULL THEN 'null'
                                  WHEN IS_NULL_VALUE(flt_kv.value) THEN 'null'
                                  WHEN TYPEOF(flt_kv.value) = 'VARCHAR' THEN TO_JSON(TO_VARIANT(flt_kv.value::VARCHAR))
                                  WHEN TYPEOF(flt_kv.value) = 'BOOLEAN' THEN LOWER(flt_kv.value::VARCHAR)
                                  WHEN TYPEOF(flt_kv.value) IN ('INTEGER','DECIMAL','DOUBLE','REAL','NUMBER') THEN flt_kv.value::VARCHAR
                                  ELSE TO_JSON(flt_kv.value)
                              END
                      END, ', ') WITHIN GROUP (ORDER BY flt_kv.key) AS obj_body
              FROM DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.change_logged_events AS _flt,
                   TABLE(FLATTEN(INPUT => _flt.data, RECURSIVE => FALSE)) flt_kv
              JOIN DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.facilities f ON _flt.facility_id = f.id
              WHERE _flt._FIVETRAN_ACTIVE = TRUE
                AND TYPEOF(_flt.data) = 'OBJECT'
                AND _flt._FIVETRAN_ACTIVE = TRUE AND f.company_id IN (137,9088,501) AND _flt.created_at >= '2024-08-01'
              GROUP BY _flt.id
          ),
          variant_data AS
          (
              SELECT
                  t.id AS id,
                  CASE

              -- ======================================================
              -- SQL NULL
              -- ======================================================

              WHEN t.data IS NULL
                  THEN '<<NULL>>'


              -- =====================================================
              -- JSON NULL
              -- =====================================================

              WHEN IS_NULL_VALUE(
                  t.data
              )
                  THEN 'null'


              -- =====================================================
              -- OBJECT
              -- =====================================================

              WHEN TYPEOF(
                  t.data
              ) = 'OBJECT'

                  THEN

                      CHR(123)

                      ||

                      COALESCE(COALESCE(obj.obj_body, ''), '')

                      ||

                      CHR(125)


              -- =====================================================
              -- ARRAY
              -- =====================================================

              WHEN TYPEOF(
                  t.data
              ) = 'ARRAY'

                  THEN COALESCE(

                      TO_JSON(
                          t.data
                      ),

                      '[]'

                  )


              -- =====================================================
              -- SCALAR
              -- =====================================================

              ELSE

                  COALESCE(

                      TO_JSON(
                          t.data
                      ),

                      '<<NULL>>'

                  )

          END AS data
              FROM
                  DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.change_logged_events t
              LEFT JOIN obj_agg_data obj ON obj.id = t.id
              JOIN DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.facilities f ON t.facility_id = f.id
              WHERE t._FIVETRAN_ACTIVE = TRUE AND f.company_id IN (137,9088,501) AND t.created_at >= '2024-08-01'

          )
          SELECT
              COALESCE(TO_VARCHAR(t.id),'<<NULL>>') AS id,
              v_data.data AS data,
              COALESCE(TO_VARCHAR(t.source_id),'<<NULL>>') AS source_id,
              COALESCE(TO_VARCHAR(t.tenant_id),'<<NULL>>') AS tenant_id,
              COALESCE(TO_VARCHAR(t.facility_id),'<<NULL>>') AS facility_id,
              COALESCE(TO_VARCHAR(t.unit_id),'<<NULL>>') AS unit_id,
              COALESCE(TO_VARCHAR(t.related_object_id),'<<NULL>>') AS related_object_id,
              COALESCE(TRIM(t.related_object_type),'<<NULL>>') AS related_object_type,
              COALESCE(TO_VARCHAR(t.created_by_id),'<<NULL>>') AS created_by_id,
              COALESCE(TRIM(t.created_by_type),'<<NULL>>') AS created_by_type,
              CASE WHEN t.resolved IS NULL THEN '<<NULL>>' WHEN t.resolved = TRUE THEN 'TRUE' WHEN t.resolved = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS resolved,
              COALESCE(TO_CHAR(t.resolved_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS resolved_on,
              COALESCE(TRIM(t.uuid),'<<NULL>>') AS uuid,
              COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,
              COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,
              CASE WHEN t.needs_followup IS NULL THEN '<<NULL>>' WHEN t.needs_followup = TRUE THEN 'TRUE' WHEN t.needs_followup = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS needs_followup,
              COALESCE(TO_CHAR(t.needs_followup_by,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS needs_followup_by,
              COALESCE(TRIM(t.company_uuid),'<<NULL>>') AS company_uuid,
              COALESCE(TRIM(t.facility_uuid),'<<NULL>>') AS facility_uuid,
              COALESCE(TRIM(t.tenant_uuid),'<<NULL>>') AS tenant_uuid,
              COALESCE(TRIM(t.ledger_uuid),'<<NULL>>') AS ledger_uuid,
              COALESCE(TRIM(t.unit_uuid),'<<NULL>>') AS unit_uuid,
              COALESCE(TRIM(t.lead_uuid),'<<NULL>>') AS lead_uuid,
              COALESCE(TRIM(t.related_object_uuid),'<<NULL>>') AS related_object_uuid
          FROM variant_data v_data LEFT JOIN DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.change_logged_events t ON v_data.id = t.id
          JOIN DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.facilities f ON t.facility_id = f.id
          WHERE t._FIVETRAN_ACTIVE = TRUE AND f.company_id IN (137,9088,501) AND t.created_at >= '2024-08-01'
