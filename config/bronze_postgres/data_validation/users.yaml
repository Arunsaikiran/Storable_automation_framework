tables:
  users:
    validations:
      data_validation:
        source_table_name: users
        source: postgres
        sourcecolumn: id
        sourcequery: |-
          SELECT
              COALESCE(CAST(id AS TEXT),'<<NULL>>') AS id,
              COALESCE(TRIM(first_name),'<<NULL>>') AS first_name,
              COALESCE(TRIM(last_name),'<<NULL>>') AS last_name,
              COALESCE(TO_CHAR(last_event_date_seen,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS last_event_date_seen,
              COALESCE(TRIM(last_ua),'<<NULL>>') AS last_ua,
              CASE WHEN password_expired IS NULL THEN '<<NULL>>' WHEN password_expired IS TRUE THEN 'TRUE' WHEN password_expired IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS password_expired,
              CASE WHEN access_to_all_facilities IS NULL THEN '<<NULL>>' WHEN access_to_all_facilities IS TRUE THEN 'TRUE' WHEN access_to_all_facilities IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS access_to_all_facilities,
              COALESCE(CAST(role_id AS TEXT),'<<NULL>>') AS role_id,
              COALESCE(CAST(company_id AS TEXT),'<<NULL>>') AS company_id,
              COALESCE(CAST(last_used_facility_id AS TEXT),'<<NULL>>') AS last_used_facility_id,
              COALESCE(TRIM(email),'<<NULL>>') AS email,
              COALESCE(TRIM(encrypted_password),'<<NULL>>') AS encrypted_password,
              COALESCE(TRIM(reset_password_token),'<<NULL>>') AS reset_password_token,
              COALESCE(TO_CHAR(reset_password_sent_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS reset_password_sent_at,
              COALESCE(TO_CHAR(remember_created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS remember_created_at,
              COALESCE(CAST(sign_in_count AS TEXT),'<<NULL>>') AS sign_in_count,
              COALESCE(TO_CHAR(current_sign_in_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS current_sign_in_at,
              COALESCE(TO_CHAR(last_sign_in_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS last_sign_in_at,
              COALESCE(TRIM(current_sign_in_ip),'<<NULL>>') AS current_sign_in_ip,
              COALESCE(TRIM(last_sign_in_ip),'<<NULL>>') AS last_sign_in_ip,
              COALESCE(TO_CHAR(created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,
              COALESCE(TO_CHAR(updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,
              COALESCE(UPPER(TRIM(CAST(uuid AS TEXT))),'<<NULL>>') AS uuid,
              CASE WHEN deleted IS NULL THEN '<<NULL>>' WHEN deleted IS TRUE THEN 'TRUE' WHEN deleted IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS deleted,
              COALESCE(TO_CHAR(deleted_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS deleted_on,
              COALESCE(CAST(deleted_by_id AS TEXT),'<<NULL>>') AS deleted_by_id,
              COALESCE(TRIM(username),'<<NULL>>') AS username,
              COALESCE(TO_CHAR(password_changed_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS password_changed_at,
              COALESCE(TO_CHAR(locked_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS locked_at,
              COALESCE(CAST(failed_attempts AS TEXT),'<<NULL>>') AS failed_attempts,
              CASE WHEN turned_on IS NULL THEN '<<NULL>>' WHEN turned_on IS TRUE THEN 'TRUE' WHEN turned_on IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS turned_on,
              COALESCE(TO_CHAR(turned_off_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS turned_off_on,
              COALESCE(CAST(employee_id AS TEXT),'<<NULL>>') AS employee_id,
              COALESCE(TRIM(internal_employee_code),'<<NULL>>') AS internal_employee_code,
              COALESCE(TRIM(last_session_id),'<<NULL>>') AS last_session_id,
              COALESCE((valid_sessions)::JSONB::TEXT,'<<NULL>>') AS valid_sessions,
              COALESCE(TRIM(storable_sso_id),'<<NULL>>') AS storable_sso_id,
              CASE WHEN can_access_up IS NULL THEN '<<NULL>>' WHEN can_access_up IS TRUE THEN 'TRUE' WHEN can_access_up IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS can_access_up,
              CASE WHEN can_access_fms IS NULL THEN '<<NULL>>' WHEN can_access_fms IS TRUE THEN 'TRUE' WHEN can_access_fms IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS can_access_fms,
              COALESCE(TRIM(pre_storable_sso_id),'<<NULL>>') AS pre_storable_sso_id
          FROM public.users
          ;
        target_table_name: users
        target: snowflake
        targetcolumn: id
        targetquery: |-
          WITH
          obj_agg_valid_sessions AS
          (
              SELECT
                  _flt.id AS id,
                  LISTAGG(
                      CASE
                          WHEN flt_kv.key IS NULL THEN NULL
                          ELSE
                              TO_JSON(TO_VARIANT(flt_kv.key::VARCHAR)) || ': ' ||
                              CASE
                                  WHEN flt_kv.value IS NULL THEN 'null'
                                  WHEN IS_NULL_VALUE(flt_kv.value) THEN 'null'
                                  WHEN TYPEOF(flt_kv.value) = 'VARCHAR' THEN TO_JSON(TO_VARIANT(flt_kv.value::VARCHAR))
                                  WHEN TYPEOF(flt_kv.value) = 'BOOLEAN' THEN LOWER(flt_kv.value::VARCHAR)
                                  WHEN TYPEOF(flt_kv.value) IN ('INTEGER','DECIMAL','DOUBLE','REAL','NUMBER') THEN flt_kv.value::VARCHAR
                                  ELSE TO_JSON(flt_kv.value)
                              END
                      END, ', ') WITHIN GROUP (ORDER BY flt_kv.key) AS obj_body
              FROM {env}_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.users AS _flt
                   , TABLE(FLATTEN(INPUT => _flt.valid_sessions, RECURSIVE => FALSE)) flt_kv
              WHERE _flt._FIVETRAN_ACTIVE = TRUE
                AND TYPEOF(_flt.valid_sessions) = 'OBJECT'
                AND _flt._FIVETRAN_ACTIVE = TRUE
              GROUP BY _flt.id
          ),
          variant_valid_sessions AS
          (
              SELECT
                  t.id AS id,
                  CASE

              -- ======================================================
              -- SQL NULL
              -- ======================================================

              WHEN t.valid_sessions IS NULL
                  THEN '<<NULL>>'


              -- =====================================================
              -- JSON NULL
              -- =====================================================

              WHEN IS_NULL_VALUE(
                  t.valid_sessions
              )
                  THEN 'null'


              -- =====================================================
              -- OBJECT
              -- =====================================================

              WHEN TYPEOF(
                  t.valid_sessions
              ) = 'OBJECT'

                  THEN

                      CHR(123)

                      ||

                      COALESCE(COALESCE(obj.obj_body, ''), '')

                      ||

                      CHR(125)


              -- =====================================================
              -- ARRAY
              -- =====================================================

              WHEN TYPEOF(
                  t.valid_sessions
              ) = 'ARRAY'

                  THEN COALESCE(

                      TO_JSON(
                          t.valid_sessions
                      ),

                      '[]'

                  )


              -- =====================================================
              -- SCALAR
              -- =====================================================

              ELSE

                  COALESCE(

                      TO_JSON(
                          t.valid_sessions
                      ),

                      '<<NULL>>'

                  )

          END AS valid_sessions
              FROM
                  {env}_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.users t
              LEFT JOIN obj_agg_valid_sessions obj ON obj.id = t.id
              WHERE t._FIVETRAN_ACTIVE = TRUE

          )
          SELECT
              COALESCE(TO_VARCHAR(t.id),'<<NULL>>') AS id,
              COALESCE(TRIM(t.first_name),'<<NULL>>') AS first_name,
              COALESCE(TRIM(t.last_name),'<<NULL>>') AS last_name,
              COALESCE(TO_CHAR(t.last_event_date_seen,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS last_event_date_seen,
              COALESCE(TRIM(t.last_ua),'<<NULL>>') AS last_ua,
              CASE WHEN t.password_expired IS NULL THEN '<<NULL>>' WHEN t.password_expired = TRUE THEN 'TRUE' WHEN t.password_expired = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS password_expired,
              CASE WHEN t.access_to_all_facilities IS NULL THEN '<<NULL>>' WHEN t.access_to_all_facilities = TRUE THEN 'TRUE' WHEN t.access_to_all_facilities = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS access_to_all_facilities,
              COALESCE(TO_VARCHAR(t.role_id),'<<NULL>>') AS role_id,
              COALESCE(TO_VARCHAR(t.company_id),'<<NULL>>') AS company_id,
              COALESCE(TO_VARCHAR(t.last_used_facility_id),'<<NULL>>') AS last_used_facility_id,
              COALESCE(TRIM(t.email),'<<NULL>>') AS email,
              COALESCE(TRIM(t.encrypted_password),'<<NULL>>') AS encrypted_password,
              COALESCE(TRIM(t.reset_password_token),'<<NULL>>') AS reset_password_token,
              COALESCE(TO_CHAR(t.reset_password_sent_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS reset_password_sent_at,
              COALESCE(TO_CHAR(t.remember_created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS remember_created_at,
              COALESCE(TO_VARCHAR(t.sign_in_count),'<<NULL>>') AS sign_in_count,
              COALESCE(TO_CHAR(t.current_sign_in_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS current_sign_in_at,
              COALESCE(TO_CHAR(t.last_sign_in_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS last_sign_in_at,
              COALESCE(TRIM(t.current_sign_in_ip),'<<NULL>>') AS current_sign_in_ip,
              COALESCE(TRIM(t.last_sign_in_ip),'<<NULL>>') AS last_sign_in_ip,
              COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,
              COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,
              COALESCE(TRIM(t.uuid),'<<NULL>>') AS uuid,
              CASE WHEN t.deleted IS NULL THEN '<<NULL>>' WHEN t.deleted = TRUE THEN 'TRUE' WHEN t.deleted = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS deleted,
              COALESCE(TO_CHAR(t.deleted_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS deleted_on,
              COALESCE(TO_VARCHAR(t.deleted_by_id),'<<NULL>>') AS deleted_by_id,
              COALESCE(TRIM(t.username),'<<NULL>>') AS username,
              COALESCE(TO_CHAR(t.password_changed_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS password_changed_at,
              COALESCE(TO_CHAR(t.locked_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS locked_at,
              COALESCE(TO_VARCHAR(t.failed_attempts),'<<NULL>>') AS failed_attempts,
              CASE WHEN t.turned_on IS NULL THEN '<<NULL>>' WHEN t.turned_on = TRUE THEN 'TRUE' WHEN t.turned_on = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS turned_on,
              COALESCE(TO_CHAR(t.turned_off_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS turned_off_on,
              COALESCE(TO_VARCHAR(t.employee_id),'<<NULL>>') AS employee_id,
              COALESCE(TRIM(t.internal_employee_code),'<<NULL>>') AS internal_employee_code,
              COALESCE(TRIM(t.last_session_id),'<<NULL>>') AS last_session_id,
              v_valid_sessions.valid_sessions AS valid_sessions,
              COALESCE(TRIM(t.storable_sso_id),'<<NULL>>') AS storable_sso_id,
              CASE WHEN t.can_access_up IS NULL THEN '<<NULL>>' WHEN t.can_access_up = TRUE THEN 'TRUE' WHEN t.can_access_up = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS can_access_up,
              CASE WHEN t.can_access_fms IS NULL THEN '<<NULL>>' WHEN t.can_access_fms = TRUE THEN 'TRUE' WHEN t.can_access_fms = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS can_access_fms,
              COALESCE(TRIM(t.pre_storable_sso_id),'<<NULL>>') AS pre_storable_sso_id
          FROM variant_valid_sessions v_valid_sessions LEFT JOIN {env}_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.users t ON v_valid_sessions.id = t.id
          WHERE t._FIVETRAN_ACTIVE = TRUE
