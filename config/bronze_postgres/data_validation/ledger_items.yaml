tables:
  ledger_items:
    validations:
      data_validation:
        source_table_name: ledger_items
        source: postgres
        sourcecolumn: id
        sourcequery: "SELECT\n    COALESCE(CAST(id AS TEXT),'<<NULL>>') AS id,\n \
          \   COALESCE(TRIM(type),'<<NULL>>') AS type,\n    COALESCE(CAST(facility_id\
          \ AS TEXT),'<<NULL>>') AS facility_id,\n    COALESCE(CAST(ledger_id AS TEXT),'<<NULL>>')\
          \ AS ledger_id,\n    COALESCE(CAST(invoiceable_item_id AS TEXT),'<<NULL>>')\
          \ AS invoiceable_item_id,\n    COALESCE(TO_CHAR(effective_date,'YYYY-MM-DD'),'<<NULL>>')\
          \ AS effective_date,\n    COALESCE(TO_CHAR(cancel_date,'YYYY-MM-DD'),'<<NULL>>')\
          \ AS cancel_date,\n    CASE WHEN data IS NULL THEN '<<NULL>>' ELSE COALESCE('{'\
          \ || (SELECT STRING_AGG(TO_JSON(h.key::TEXT) || ': ' || TO_JSON(h.value::TEXT),\
          \ ', ' ORDER BY h.key) FROM EACH(data) h) || '}', '{}') END AS data,\n \
          \   COALESCE(TO_CHAR(created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS created_at,\n    COALESCE(TO_CHAR(updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS updated_at,\n    COALESCE(UPPER(TRIM(CAST(uuid AS TEXT))),'<<NULL>>')\
          \ AS uuid,\n    CASE WHEN signed IS NULL THEN '<<NULL>>' WHEN signed IS\
          \ TRUE THEN 'TRUE' WHEN signed IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END\
          \ AS signed,\n    COALESCE(TRIM(status),'<<NULL>>') AS status,\n    COALESCE(TO_CHAR(effective_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS effective_at\nFROM public.ledger_items;"
        target_table_name: ledger_items
        target: snowflake
        targetcolumn: id
        targetquery: "WITH\nobj_agg_data AS\n(\n    SELECT\n        _flt.id AS id,\n\
          \        LISTAGG(\n            CASE\n                WHEN f.key IS NULL\
          \ THEN NULL\n                ELSE\n                    TO_JSON(TO_VARIANT(f.key::VARCHAR))\
          \ || ': ' ||\n                    CASE\n                        WHEN f.value\
          \ IS NULL THEN 'null'\n                        WHEN IS_NULL_VALUE(f.value)\
          \ THEN 'null'\n                        WHEN TYPEOF(f.value) = 'VARCHAR'\
          \ THEN TO_JSON(TO_VARIANT(f.value::VARCHAR))\n                        WHEN\
          \ TYPEOF(f.value) = 'BOOLEAN' THEN LOWER(f.value::VARCHAR)\n           \
          \             WHEN TYPEOF(f.value) IN ('INTEGER','DECIMAL','DOUBLE','REAL','NUMBER')\
          \ THEN f.value::VARCHAR\n                        ELSE TO_JSON(f.value)\n\
          \                    END\n            END, ', ') WITHIN GROUP (ORDER BY\
          \ f.key) AS obj_body\n    FROM DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.ledger_items\
          \ AS _flt,\n         TABLE(FLATTEN(INPUT => _flt.data, RECURSIVE => FALSE))\
          \ f\n    WHERE _flt._FIVETRAN_ACTIVE = TRUE\n      AND TYPEOF(_flt.data)\
          \ = 'OBJECT'\n      AND _flt._FIVETRAN_ACTIVE = TRUE\n    GROUP BY _flt.id\n\
          ),\nvariant_data AS\n(\n    SELECT\n        t.id AS id,\n        CASE\n\n\
          \    -- ======================================================\n    -- SQL\
          \ NULL\n    -- ======================================================\n\n\
          \    WHEN t.data IS NULL\n        THEN '<<NULL>>'\n\n\n    -- =====================================================\n\
          \    -- JSON NULL\n    -- =====================================================\n\
          \n    WHEN IS_NULL_VALUE(\n        t.data\n    )\n        THEN 'null'\n\n\
          \n    -- =====================================================\n    -- OBJECT\n\
          \    -- =====================================================\n\n    WHEN\
          \ TYPEOF(\n        t.data\n    ) = 'OBJECT'\n\n        THEN\n\n        \
          \    CHR(123)\n\n            ||\n\n            COALESCE(COALESCE(obj.obj_body,\
          \ ''), '')\n\n            ||\n\n            CHR(125)\n\n\n    -- =====================================================\n\
          \    -- ARRAY\n    -- =====================================================\n\
          \n    WHEN TYPEOF(\n        t.data\n    ) = 'ARRAY'\n\n        THEN COALESCE(\n\
          \n            TO_JSON(\n                t.data\n            ),\n\n     \
          \       '[]'\n\n        )\n\n\n    -- =====================================================\n\
          \    -- SCALAR\n    -- =====================================================\n\
          \n    ELSE\n\n        COALESCE(\n\n            TO_JSON(\n              \
          \  t.data\n            ),\n\n            '<<NULL>>'\n\n        )\n\nEND\
          \ AS data\n    FROM\n        DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.ledger_items\
          \ t\n    LEFT JOIN obj_agg_data obj ON obj.id = t.id\n    WHERE t._FIVETRAN_ACTIVE\
          \ = TRUE\n\n)\nSELECT\n    COALESCE(TO_VARCHAR(t.id),'<<NULL>>') AS id,\n\
          \    COALESCE(TRIM(t.type),'<<NULL>>') AS type,\n    COALESCE(TO_VARCHAR(t.facility_id),'<<NULL>>')\
          \ AS facility_id,\n    COALESCE(TO_VARCHAR(t.ledger_id),'<<NULL>>') AS ledger_id,\n\
          \    COALESCE(TO_VARCHAR(t.invoiceable_item_id),'<<NULL>>') AS invoiceable_item_id,\n\
          \    COALESCE(TO_CHAR(t.effective_date,'YYYY-MM-DD'),'<<NULL>>') AS effective_date,\n\
          \    COALESCE(TO_CHAR(t.cancel_date,'YYYY-MM-DD'),'<<NULL>>') AS cancel_date,\n\
          \    v_data.data AS data,\n    COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,\n    COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,\n    COALESCE(TRIM(t.uuid),'<<NULL>>')\
          \ AS uuid,\n    CASE WHEN t.signed IS NULL THEN '<<NULL>>' WHEN t.signed\
          \ = TRUE THEN 'TRUE' WHEN t.signed = FALSE THEN 'FALSE' ELSE '<<NULL>>'\
          \ END AS signed,\n    COALESCE(TRIM(t.status),'<<NULL>>') AS status,\n \
          \   COALESCE(TO_CHAR(t.effective_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS effective_at\nFROM variant_data v_data LEFT JOIN DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.ledger_items\
          \ t ON v_data.id = t.id\nWHERE t._FIVETRAN_ACTIVE = TRUE"
