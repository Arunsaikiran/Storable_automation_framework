tables:
  invoiceable_items:
    validations:
      data_validation:
        source_table_name: invoiceable_items
        source: postgres
        sourcecolumn: id
        sourcequery: |-
          SELECT
              COALESCE(CAST(id AS TEXT),'<<NULL>>') AS id,
              COALESCE(TRIM(type),'<<NULL>>') AS type,
              COALESCE(TRIM(product_code),'<<NULL>>') AS product_code,
              COALESCE(TRIM(description),'<<NULL>>') AS description,
              COALESCE(CAST(CAST(cost AS NUMERIC(38,2)) AS TEXT),'<<NULL>>') AS cost,
              CASE WHEN deletable IS NULL THEN '<<NULL>>' WHEN deletable IS TRUE THEN 'TRUE' WHEN deletable IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS deletable,
              CASE WHEN deleted IS NULL THEN '<<NULL>>' WHEN deleted IS TRUE THEN 'TRUE' WHEN deleted IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS deleted,
              COALESCE(TO_CHAR(deleted_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS deleted_on,
              COALESCE(CAST(deleted_by_id AS TEXT),'<<NULL>>') AS deleted_by_id,
              COALESCE(CAST(facility_id AS TEXT),'<<NULL>>') AS facility_id,
              COALESCE(CAST(created_by_id AS TEXT),'<<NULL>>') AS created_by_id,
              COALESCE(TO_CHAR(created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,
              COALESCE(TO_CHAR(updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,
              COALESCE(UPPER(TRIM(CAST(uuid AS TEXT))),'<<NULL>>') AS uuid,
              CASE WHEN data IS NULL THEN '<<NULL>>' ELSE COALESCE('{' || (SELECT STRING_AGG(TO_JSON(h.key::TEXT) || ': ' || TO_JSON(h.value::TEXT), ', ' ORDER BY h.key) FROM EACH(data) h) || '}', '{}') END AS data,
              CASE WHEN turned_on IS NULL THEN '<<NULL>>' WHEN turned_on IS TRUE THEN 'TRUE' WHEN turned_on IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS turned_on,
              CASE WHEN required_at_move_in IS NULL THEN '<<NULL>>' WHEN required_at_move_in IS TRUE THEN 'TRUE' WHEN required_at_move_in IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS required_at_move_in,
              CASE WHEN required_at_transfer IS NULL THEN '<<NULL>>' WHEN required_at_transfer IS TRUE THEN 'TRUE' WHEN required_at_transfer IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS required_at_transfer,
              COALESCE(TRIM(short_description),'<<NULL>>') AS short_description,
              CASE WHEN show_in_sales_center IS NULL THEN '<<NULL>>' WHEN show_in_sales_center IS TRUE THEN 'TRUE' WHEN show_in_sales_center IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS show_in_sales_center,
              COALESCE(TO_CHAR(turned_off_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS turned_off_on,
              COALESCE(TRIM(internal_account_code),'<<NULL>>') AS internal_account_code,
              COALESCE(CAST(insurance_policy_id AS TEXT),'<<NULL>>') AS insurance_policy_id,
              COALESCE(CAST(master_retail_item_id AS TEXT),'<<NULL>>') AS master_retail_item_id,
              COALESCE(CAST(delinquency_schedule_id AS TEXT),'<<NULL>>') AS delinquency_schedule_id,
              COALESCE(TRIM(internal_accounts_receivable_account_code),'<<NULL>>') AS internal_accounts_receivable_account_code,
              CASE WHEN auto_update IS NULL THEN '<<NULL>>' WHEN auto_update IS TRUE THEN 'TRUE' WHEN auto_update IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS auto_update
          FROM public.invoiceable_items
          ;
        target_table_name: invoiceable_items
        target: snowflake
        targetcolumn: id
        targetquery: |-
          WITH
          obj_agg_data AS
          (
              SELECT
                  _flt.id AS id,
                  LISTAGG(
                      CASE
                          WHEN flt_kv.key IS NULL THEN NULL
                          ELSE
                              TO_JSON(TO_VARIANT(flt_kv.key::VARCHAR)) || ': ' ||
                              CASE
                                  WHEN flt_kv.value IS NULL THEN 'null'
                                  WHEN IS_NULL_VALUE(flt_kv.value) THEN 'null'
                                  WHEN TYPEOF(flt_kv.value) = 'VARCHAR' THEN TO_JSON(TO_VARIANT(flt_kv.value::VARCHAR))
                                  WHEN TYPEOF(flt_kv.value) = 'BOOLEAN' THEN LOWER(flt_kv.value::VARCHAR)
                                  WHEN TYPEOF(flt_kv.value) IN ('INTEGER','DECIMAL','DOUBLE','REAL','NUMBER') THEN flt_kv.value::VARCHAR
                                  ELSE TO_JSON(flt_kv.value)
                              END
                      END, ', ') WITHIN GROUP (ORDER BY flt_kv.key) AS obj_body
              FROM DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.invoiceable_items AS _flt,
                   TABLE(FLATTEN(INPUT => _flt.data, RECURSIVE => FALSE)) flt_kv
              WHERE _flt._FIVETRAN_ACTIVE = TRUE
                AND TYPEOF(_flt.data) = 'OBJECT'
                AND _flt._FIVETRAN_ACTIVE = TRUE
              GROUP BY _flt.id
          ),
          variant_data AS
          (
              SELECT
                  t.id AS id,
                  CASE

              -- ======================================================
              -- SQL NULL
              -- ======================================================

              WHEN t.data IS NULL
                  THEN '<<NULL>>'


              -- =====================================================
              -- JSON NULL
              -- =====================================================

              WHEN IS_NULL_VALUE(
                  t.data
              )
                  THEN 'null'


              -- =====================================================
              -- OBJECT
              -- =====================================================

              WHEN TYPEOF(
                  t.data
              ) = 'OBJECT'

                  THEN

                      CHR(123)

                      ||

                      COALESCE(COALESCE(obj.obj_body, ''), '')

                      ||

                      CHR(125)


              -- =====================================================
              -- ARRAY
              -- =====================================================

              WHEN TYPEOF(
                  t.data
              ) = 'ARRAY'

                  THEN COALESCE(

                      TO_JSON(
                          t.data
                      ),

                      '[]'

                  )


              -- =====================================================
              -- SCALAR
              -- =====================================================

              ELSE

                  COALESCE(

                      TO_JSON(
                          t.data
                      ),

                      '<<NULL>>'

                  )

          END AS data
              FROM
                  DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.invoiceable_items t
              LEFT JOIN obj_agg_data obj ON obj.id = t.id
              WHERE t._FIVETRAN_ACTIVE = TRUE

          )
          SELECT
              COALESCE(TO_VARCHAR(t.id),'<<NULL>>') AS id,
              COALESCE(TRIM(t.type),'<<NULL>>') AS type,
              COALESCE(TRIM(t.product_code),'<<NULL>>') AS product_code,
              COALESCE(TRIM(t.description),'<<NULL>>') AS description,
              COALESCE(TO_VARCHAR(t.cost),'<<NULL>>') AS cost,
              CASE WHEN t.deletable IS NULL THEN '<<NULL>>' WHEN t.deletable = TRUE THEN 'TRUE' WHEN t.deletable = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS deletable,
              CASE WHEN t.deleted IS NULL THEN '<<NULL>>' WHEN t.deleted = TRUE THEN 'TRUE' WHEN t.deleted = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS deleted,
              COALESCE(TO_CHAR(t.deleted_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS deleted_on,
              COALESCE(TO_VARCHAR(t.deleted_by_id),'<<NULL>>') AS deleted_by_id,
              COALESCE(TO_VARCHAR(t.facility_id),'<<NULL>>') AS facility_id,
              COALESCE(TO_VARCHAR(t.created_by_id),'<<NULL>>') AS created_by_id,
              COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,
              COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,
              COALESCE(TRIM(t.uuid),'<<NULL>>') AS uuid,
              v_data.data AS data,
              CASE WHEN t.turned_on IS NULL THEN '<<NULL>>' WHEN t.turned_on = TRUE THEN 'TRUE' WHEN t.turned_on = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS turned_on,
              CASE WHEN t.required_at_move_in IS NULL THEN '<<NULL>>' WHEN t.required_at_move_in = TRUE THEN 'TRUE' WHEN t.required_at_move_in = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS required_at_move_in,
              CASE WHEN t.required_at_transfer IS NULL THEN '<<NULL>>' WHEN t.required_at_transfer = TRUE THEN 'TRUE' WHEN t.required_at_transfer = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS required_at_transfer,
              COALESCE(TRIM(t.short_description),'<<NULL>>') AS short_description,
              CASE WHEN t.show_in_sales_center IS NULL THEN '<<NULL>>' WHEN t.show_in_sales_center = TRUE THEN 'TRUE' WHEN t.show_in_sales_center = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS show_in_sales_center,
              COALESCE(TO_CHAR(t.turned_off_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS turned_off_on,
              COALESCE(TRIM(t.internal_account_code),'<<NULL>>') AS internal_account_code,
              COALESCE(TO_VARCHAR(t.insurance_policy_id),'<<NULL>>') AS insurance_policy_id,
              COALESCE(TO_VARCHAR(t.master_retail_item_id),'<<NULL>>') AS master_retail_item_id,
              COALESCE(TO_VARCHAR(t.delinquency_schedule_id),'<<NULL>>') AS delinquency_schedule_id,
              COALESCE(TRIM(t.internal_accounts_receivable_account_code),'<<NULL>>') AS internal_accounts_receivable_account_code,
              CASE WHEN t.auto_update IS NULL THEN '<<NULL>>' WHEN t.auto_update = TRUE THEN 'TRUE' WHEN t.auto_update = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS auto_update
          FROM variant_data v_data LEFT JOIN DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.invoiceable_items t ON v_data.id = t.id
          WHERE t._FIVETRAN_ACTIVE = TRUE
