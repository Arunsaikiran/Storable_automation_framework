tables:
  delinquency_stage_actions:
    validations:
      data_validation:
        source_table_name: delinquency_stage_actions
        source: postgres
        sourcecolumn: id
        sourcequery: "SELECT\n    COALESCE(CAST(id AS TEXT),'<<NULL>>') AS id,\n \
          \   COALESCE(CAST(delinquency_stage_id AS TEXT),'<<NULL>>') AS delinquency_stage_id,\n\
          \    COALESCE(TRIM(name),'<<NULL>>') AS name,\n    CASE WHEN params IS NULL\
          \ THEN '<<NULL>>' ELSE COALESCE('{' || (SELECT STRING_AGG(TO_JSON(h.key::TEXT)\
          \ || ': ' || TO_JSON(h.value::TEXT), ', ' ORDER BY h.key) FROM EACH(params)\
          \ h) || '}', '{}') END AS params,\n    CASE WHEN deleted IS NULL THEN '<<NULL>>'\
          \ WHEN deleted IS TRUE THEN 'TRUE' WHEN deleted IS FALSE THEN 'FALSE' ELSE\
          \ '<<NULL>>' END AS deleted,\n    COALESCE(TO_CHAR(deleted_on,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS deleted_on,\n    COALESCE(CAST(deleted_by_id\
          \ AS TEXT),'<<NULL>>') AS deleted_by_id,\n    COALESCE(TO_CHAR(created_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,\n    COALESCE(TO_CHAR(updated_at,'YYYY-MM-DD\
          \ HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,\n    COALESCE(UPPER(TRIM(CAST(uuid\
          \ AS TEXT))),'<<NULL>>') AS uuid,\n    COALESCE(CAST(invoiceable_item_id\
          \ AS TEXT),'<<NULL>>') AS invoiceable_item_id,\n    COALESCE(CAST(template_id\
          \ AS TEXT),'<<NULL>>') AS template_id,\n    COALESCE(CAST(sms_template_id\
          \ AS TEXT),'<<NULL>>') AS sms_template_id,\n    COALESCE(CAST(email_template_id\
          \ AS TEXT),'<<NULL>>') AS email_template_id,\n    COALESCE(CAST(mail_house_template_id\
          \ AS TEXT),'<<NULL>>') AS mail_house_template_id,\n    CASE WHEN require_file_upload\
          \ IS NULL THEN '<<NULL>>' WHEN require_file_upload IS TRUE THEN 'TRUE' WHEN\
          \ require_file_upload IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS require_file_upload\n\
          FROM public.delinquency_stage_actions;"
        target_table_name: delinquency_stage_actions
        target: snowflake
        targetcolumn: id
        targetquery: "WITH\nobj_agg_params AS\n(\n    SELECT\n        _flt.id AS id,\n\
          \        LISTAGG(\n            CASE\n                WHEN f.key IS NULL\
          \ THEN NULL\n                ELSE\n                    TO_JSON(TO_VARIANT(f.key::VARCHAR))\
          \ || ': ' ||\n                    CASE\n                        WHEN f.value\
          \ IS NULL THEN 'null'\n                        WHEN IS_NULL_VALUE(f.value)\
          \ THEN 'null'\n                        WHEN TYPEOF(f.value) = 'VARCHAR'\
          \ THEN TO_JSON(TO_VARIANT(f.value::VARCHAR))\n                        WHEN\
          \ TYPEOF(f.value) = 'BOOLEAN' THEN LOWER(f.value::VARCHAR)\n           \
          \             WHEN TYPEOF(f.value) IN ('INTEGER','DECIMAL','DOUBLE','REAL','NUMBER')\
          \ THEN f.value::VARCHAR\n                        ELSE TO_JSON(f.value)\n\
          \                    END\n            END, ', ') WITHIN GROUP (ORDER BY\
          \ f.key) AS obj_body\n    FROM DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.delinquency_stage_actions\
          \ AS _flt,\n         TABLE(FLATTEN(INPUT => _flt.params, RECURSIVE => FALSE))\
          \ f\n    WHERE _flt._FIVETRAN_ACTIVE = TRUE\n      AND TYPEOF(_flt.params)\
          \ = 'OBJECT'\n      AND _flt._FIVETRAN_ACTIVE = TRUE\n    GROUP BY _flt.id\n\
          ),\nvariant_params AS\n(\n    SELECT\n        t.id AS id,\n        CASE\n\
          \n    -- ======================================================\n    --\
          \ SQL NULL\n    -- ======================================================\n\
          \n    WHEN t.params IS NULL\n        THEN '<<NULL>>'\n\n\n    -- =====================================================\n\
          \    -- JSON NULL\n    -- =====================================================\n\
          \n    WHEN IS_NULL_VALUE(\n        t.params\n    )\n        THEN 'null'\n\
          \n\n    -- =====================================================\n    --\
          \ OBJECT\n    -- =====================================================\n\
          \n    WHEN TYPEOF(\n        t.params\n    ) = 'OBJECT'\n\n        THEN\n\
          \n            CHR(123)\n\n            ||\n\n            COALESCE(COALESCE(obj.obj_body,\
          \ ''), '')\n\n            ||\n\n            CHR(125)\n\n\n    -- =====================================================\n\
          \    -- ARRAY\n    -- =====================================================\n\
          \n    WHEN TYPEOF(\n        t.params\n    ) = 'ARRAY'\n\n        THEN COALESCE(\n\
          \n            TO_JSON(\n                t.params\n            ),\n\n   \
          \         '[]'\n\n        )\n\n\n    -- =====================================================\n\
          \    -- SCALAR\n    -- =====================================================\n\
          \n    ELSE\n\n        COALESCE(\n\n            TO_JSON(\n              \
          \  t.params\n            ),\n\n            '<<NULL>>'\n\n        )\n\nEND\
          \ AS params\n    FROM\n        DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.delinquency_stage_actions\
          \ t\n    LEFT JOIN obj_agg_params obj ON obj.id = t.id\n    WHERE t._FIVETRAN_ACTIVE\
          \ = TRUE\n\n)\nSELECT\n    COALESCE(TO_VARCHAR(t.id),'<<NULL>>') AS id,\n\
          \    COALESCE(TO_VARCHAR(t.delinquency_stage_id),'<<NULL>>') AS delinquency_stage_id,\n\
          \    COALESCE(TRIM(t.name),'<<NULL>>') AS name,\n    v_params.params AS\
          \ params,\n    CASE WHEN t.deleted IS NULL THEN '<<NULL>>' WHEN t.deleted\
          \ = TRUE THEN 'TRUE' WHEN t.deleted = FALSE THEN 'FALSE' ELSE '<<NULL>>'\
          \ END AS deleted,\n    COALESCE(TO_CHAR(t.deleted_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS deleted_on,\n    COALESCE(TO_VARCHAR(t.deleted_by_id),'<<NULL>>') AS\
          \ deleted_by_id,\n    COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS created_at,\n    COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>')\
          \ AS updated_at,\n    COALESCE(TRIM(t.uuid),'<<NULL>>') AS uuid,\n    COALESCE(TO_VARCHAR(t.invoiceable_item_id),'<<NULL>>')\
          \ AS invoiceable_item_id,\n    COALESCE(TO_VARCHAR(t.template_id),'<<NULL>>')\
          \ AS template_id,\n    COALESCE(TO_VARCHAR(t.sms_template_id),'<<NULL>>')\
          \ AS sms_template_id,\n    COALESCE(TO_VARCHAR(t.email_template_id),'<<NULL>>')\
          \ AS email_template_id,\n    COALESCE(TO_VARCHAR(t.mail_house_template_id),'<<NULL>>')\
          \ AS mail_house_template_id,\n    CASE WHEN t.require_file_upload IS NULL\
          \ THEN '<<NULL>>' WHEN t.require_file_upload = TRUE THEN 'TRUE' WHEN t.require_file_upload\
          \ = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS require_file_upload\nFROM\
          \ variant_params v_params LEFT JOIN DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.delinquency_stage_actions\
          \ t ON v_params.id = t.id\nWHERE t._FIVETRAN_ACTIVE = TRUE"
