tables:
  payment_methods:
    validations:
      data_validation:
        source_table_name: payment_methods
        source: postgres
        sourcecolumn: id
        sourcequery: |-
          SELECT
              COALESCE(CAST(t.id AS TEXT),'<<NULL>>') AS id,
              COALESCE(TRIM(t.type),'<<NULL>>') AS type,
              CASE WHEN t.reuseable IS NULL THEN '<<NULL>>' WHEN t.reuseable IS TRUE THEN 'TRUE' WHEN t.reuseable IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS reuseable,
              CASE WHEN t.data IS NULL THEN '<<NULL>>' ELSE COALESCE('{' || (SELECT STRING_AGG(TO_JSON(h.key::TEXT) || ': ' || TO_JSON(h.value::TEXT), ', ' ORDER BY h.key) FROM EACH(t.data) h) || '}', '{}') END AS data,
              CASE WHEN t.payment_provider_data IS NULL THEN '<<NULL>>' ELSE COALESCE('{' || (SELECT STRING_AGG(TO_JSON(h.key::TEXT) || ': ' || TO_JSON(h.value::TEXT), ', ' ORDER BY h.key) FROM EACH(t.payment_provider_data) h) || '}', '{}') END AS payment_provider_data,
              CASE WHEN t.deleted IS NULL THEN '<<NULL>>' WHEN t.deleted IS TRUE THEN 'TRUE' WHEN t.deleted IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS deleted,
              COALESCE(TO_CHAR(t.deleted_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS deleted_on,
              COALESCE(CAST(t.deleted_by_id AS TEXT),'<<NULL>>') AS deleted_by_id,
              COALESCE(CAST(t.facility_id AS TEXT),'<<NULL>>') AS facility_id,
              COALESCE(CAST(t.tenant_id AS TEXT),'<<NULL>>') AS tenant_id,
              COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,
              COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,
              COALESCE(UPPER(TRIM(CAST(t.uuid AS TEXT))),'<<NULL>>') AS uuid,
              COALESCE(TRIM(t.payment_provider_token_enc),'<<NULL>>') AS payment_provider_token_enc,
              COALESCE(TRIM(t.payment_provider_name),'<<NULL>>') AS payment_provider_name,
              CASE WHEN t.turned_off IS NULL THEN '<<NULL>>' WHEN t.turned_off IS TRUE THEN 'TRUE' WHEN t.turned_off IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS turned_off,
              COALESCE(TRIM(t.payment_provider_token_id_enc),'<<NULL>>') AS payment_provider_token_id_enc,
              COALESCE(TRIM(t.stopay_token_enc),'<<NULL>>') AS stopay_token_enc,
              CASE WHEN t.surchargeable IS NULL THEN '<<NULL>>' WHEN t.surchargeable IS TRUE THEN 'TRUE' WHEN t.surchargeable IS FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS surchargeable
          FROM public.payment_methods t
          JOIN public.facilities f ON t.facility_id = f.id
          WHERE f.company_id IN (137,9088,501) AND t.created_at >= '2024-08-01';
        target_table_name: payment_methods
        target: snowflake
        targetcolumn: id
        targetquery: |-
          WITH
          obj_agg_data AS
          (
              SELECT
                  _flt.id AS id,
                  LISTAGG(
                      CASE
                          WHEN flt_kv.key IS NULL THEN NULL
                          ELSE
                              TO_JSON(TO_VARIANT(flt_kv.key::VARCHAR)) || ': ' ||
                              CASE
                                  WHEN flt_kv.value IS NULL THEN 'null'
                                  WHEN IS_NULL_VALUE(flt_kv.value) THEN 'null'
                                  WHEN TYPEOF(flt_kv.value) = 'VARCHAR' THEN TO_JSON(TO_VARIANT(flt_kv.value::VARCHAR))
                                  WHEN TYPEOF(flt_kv.value) = 'BOOLEAN' THEN LOWER(flt_kv.value::VARCHAR)
                                  WHEN TYPEOF(flt_kv.value) IN ('INTEGER','DECIMAL','DOUBLE','REAL','NUMBER') THEN flt_kv.value::VARCHAR
                                  ELSE TO_JSON(flt_kv.value)
                              END
                      END, ', ') WITHIN GROUP (ORDER BY flt_kv.key) AS obj_body
              FROM DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.payment_methods AS _flt,
                   TABLE(FLATTEN(INPUT => _flt.data, RECURSIVE => FALSE)) flt_kv
              JOIN DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.facilities f ON _flt.facility_id = f.id
              WHERE _flt._FIVETRAN_ACTIVE = TRUE
                AND TYPEOF(_flt.data) = 'OBJECT'
                AND _flt._FIVETRAN_ACTIVE = TRUE AND f.company_id IN (137,9088,501) AND _flt.created_at >= '2024-08-01'
              GROUP BY _flt.id
          ),
          variant_data AS
          (
              SELECT
                  t.id AS id,
                  CASE

              -- ======================================================
              -- SQL NULL
              -- ======================================================

              WHEN t.data IS NULL
                  THEN '<<NULL>>'


              -- =====================================================
              -- JSON NULL
              -- =====================================================

              WHEN IS_NULL_VALUE(
                  t.data
              )
                  THEN 'null'


              -- =====================================================
              -- OBJECT
              -- =====================================================

              WHEN TYPEOF(
                  t.data
              ) = 'OBJECT'

                  THEN

                      CHR(123)

                      ||

                      COALESCE(COALESCE(obj.obj_body, ''), '')

                      ||

                      CHR(125)


              -- =====================================================
              -- ARRAY
              -- =====================================================

              WHEN TYPEOF(
                  t.data
              ) = 'ARRAY'

                  THEN COALESCE(

                      TO_JSON(
                          t.data
                      ),

                      '[]'

                  )


              -- =====================================================
              -- SCALAR
              -- =====================================================

              ELSE

                  COALESCE(

                      TO_JSON(
                          t.data
                      ),

                      '<<NULL>>'

                  )

          END AS data
              FROM
                  DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.payment_methods t
              LEFT JOIN obj_agg_data obj ON obj.id = t.id
              JOIN DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.facilities f ON t.facility_id = f.id
              WHERE t._FIVETRAN_ACTIVE = TRUE AND f.company_id IN (137,9088,501) AND t.created_at >= '2024-08-01'

          ),
          obj_agg_payment_provider_data AS
          (
              SELECT
                  _flt.id AS id,
                  LISTAGG(
                      CASE
                          WHEN flt_kv.key IS NULL THEN NULL
                          ELSE
                              TO_JSON(TO_VARIANT(flt_kv.key::VARCHAR)) || ': ' ||
                              CASE
                                  WHEN flt_kv.value IS NULL THEN 'null'
                                  WHEN IS_NULL_VALUE(flt_kv.value) THEN 'null'
                                  WHEN TYPEOF(flt_kv.value) = 'VARCHAR' THEN TO_JSON(TO_VARIANT(flt_kv.value::VARCHAR))
                                  WHEN TYPEOF(flt_kv.value) = 'BOOLEAN' THEN LOWER(flt_kv.value::VARCHAR)
                                  WHEN TYPEOF(flt_kv.value) IN ('INTEGER','DECIMAL','DOUBLE','REAL','NUMBER') THEN flt_kv.value::VARCHAR
                                  ELSE TO_JSON(flt_kv.value)
                              END
                      END, ', ') WITHIN GROUP (ORDER BY flt_kv.key) AS obj_body
              FROM DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.payment_methods AS _flt,
                   TABLE(FLATTEN(INPUT => _flt.payment_provider_data, RECURSIVE => FALSE)) flt_kv
              JOIN DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.facilities f ON _flt.facility_id = f.id
              WHERE _flt._FIVETRAN_ACTIVE = TRUE
                AND TYPEOF(_flt.payment_provider_data) = 'OBJECT'
                AND _flt._FIVETRAN_ACTIVE = TRUE AND f.company_id IN (137,9088,501) AND _flt.created_at >= '2024-08-01'
              GROUP BY _flt.id
          ),
          variant_payment_provider_data AS
          (
              SELECT
                  t.id AS id,
                  CASE

              -- ======================================================
              -- SQL NULL
              -- ======================================================

              WHEN t.payment_provider_data IS NULL
                  THEN '<<NULL>>'


              -- =====================================================
              -- JSON NULL
              -- =====================================================

              WHEN IS_NULL_VALUE(
                  t.payment_provider_data
              )
                  THEN 'null'


              -- =====================================================
              -- OBJECT
              -- =====================================================

              WHEN TYPEOF(
                  t.payment_provider_data
              ) = 'OBJECT'

                  THEN

                      CHR(123)

                      ||

                      COALESCE(COALESCE(obj.obj_body, ''), '')

                      ||

                      CHR(125)


              -- =====================================================
              -- ARRAY
              -- =====================================================

              WHEN TYPEOF(
                  t.payment_provider_data
              ) = 'ARRAY'

                  THEN COALESCE(

                      TO_JSON(
                          t.payment_provider_data
                      ),

                      '[]'

                  )


              -- =====================================================
              -- SCALAR
              -- =====================================================

              ELSE

                  COALESCE(

                      TO_JSON(
                          t.payment_provider_data
                      ),

                      '<<NULL>>'

                  )

          END AS payment_provider_data
              FROM
                  DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.payment_methods t
              LEFT JOIN obj_agg_payment_provider_data obj ON obj.id = t.id
              JOIN DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.facilities f ON t.facility_id = f.id
              WHERE t._FIVETRAN_ACTIVE = TRUE AND f.company_id IN (137,9088,501) AND t.created_at >= '2024-08-01'

          )
          SELECT
              COALESCE(TO_VARCHAR(t.id),'<<NULL>>') AS id,
              COALESCE(TRIM(t.type),'<<NULL>>') AS type,
              CASE WHEN t.reuseable IS NULL THEN '<<NULL>>' WHEN t.reuseable = TRUE THEN 'TRUE' WHEN t.reuseable = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS reuseable,
              v_data.data AS data,
              v_payment_provider_data.payment_provider_data AS payment_provider_data,
              CASE WHEN t.deleted IS NULL THEN '<<NULL>>' WHEN t.deleted = TRUE THEN 'TRUE' WHEN t.deleted = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS deleted,
              COALESCE(TO_CHAR(t.deleted_on,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS deleted_on,
              COALESCE(TO_VARCHAR(t.deleted_by_id),'<<NULL>>') AS deleted_by_id,
              COALESCE(TO_VARCHAR(t.facility_id),'<<NULL>>') AS facility_id,
              COALESCE(TO_VARCHAR(t.tenant_id),'<<NULL>>') AS tenant_id,
              COALESCE(TO_CHAR(t.created_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS created_at,
              COALESCE(TO_CHAR(t.updated_at,'YYYY-MM-DD HH24:MI:SS.FF3'),'<<NULL>>') AS updated_at,
              COALESCE(TRIM(t.uuid),'<<NULL>>') AS uuid,
              COALESCE(TRIM(t.payment_provider_token_enc),'<<NULL>>') AS payment_provider_token_enc,
              COALESCE(TRIM(t.payment_provider_name),'<<NULL>>') AS payment_provider_name,
              CASE WHEN t.turned_off IS NULL THEN '<<NULL>>' WHEN t.turned_off = TRUE THEN 'TRUE' WHEN t.turned_off = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS turned_off,
              COALESCE(TRIM(t.payment_provider_token_id_enc),'<<NULL>>') AS payment_provider_token_id_enc,
              COALESCE(TRIM(t.stopay_token_enc),'<<NULL>>') AS stopay_token_enc,
              CASE WHEN t.surchargeable IS NULL THEN '<<NULL>>' WHEN t.surchargeable = TRUE THEN 'TRUE' WHEN t.surchargeable = FALSE THEN 'FALSE' ELSE '<<NULL>>' END AS surchargeable
          FROM variant_payment_provider_data v_payment_provider_data LEFT JOIN variant_data v_data LEFT JOIN DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.payment_methods t ON v_data.id = t.id ON v_payment_provider_data.id = t.id
          JOIN DEV_EDGE_BRONZE.STOREDGE_FMS_PUBLIC.facilities f ON t.facility_id = f.id
          WHERE t._FIVETRAN_ACTIVE = TRUE AND f.company_id IN (137,9088,501) AND t.created_at >= '2024-08-01'
