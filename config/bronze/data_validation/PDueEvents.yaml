tables:
  PDueEvents:
    validations:
      data_validation:
        source_table_name: PDueEvents
        source: mssql
        sourcecolumn: PDueEventID
        sourcequery: |
          SELECT
              COALESCE(CAST(PDueEventID AS VARCHAR(100)),'<<NULL>>') AS PDueEventID,
              COALESCE(CAST(SiteID AS VARCHAR(100)),'<<NULL>>') AS SiteID,
              COALESCE(CAST(ChargeDescID AS VARCHAR(100)),'<<NULL>>') AS ChargeDescID,
              COALESCE(CAST(FormID AS VARCHAR(100)),'<<NULL>>') AS FormID,
              COALESCE(CAST(iFormAddrOption AS VARCHAR(100)),'<<NULL>>') AS iFormAddrOption,
              COALESCE(CAST(EventName_TermID AS VARCHAR(100)),'<<NULL>>') AS EventName_TermID,
              COALESCE(LTRIM(RTRIM(sDefEventName)),'<<NULL>>') AS sDefEventName,
              COALESCE(LTRIM(RTRIM(sEventName)),'<<NULL>>') AS sEventName,
              COALESCE(LTRIM(RTRIM(sCategory)),'<<NULL>>') AS sCategory,
              COALESCE(LTRIM(RTRIM(sComment)),'<<NULL>>') AS sComment,
              COALESCE(CAST(iDayPastDue AS VARCHAR(100)),'<<NULL>>') AS iDayPastDue,
              CASE WHEN bShowOnReminders IS NULL THEN '<<NULL>>' WHEN bShowOnReminders = 1 THEN 'TRUE' WHEN bShowOnReminders = 0 THEN 'FALSE' END AS bShowOnReminders,
              CASE WHEN bRecurring IS NULL THEN '<<NULL>>' WHEN bRecurring = 1 THEN 'TRUE' WHEN bRecurring = 0 THEN 'FALSE' END AS bRecurring,
              CASE WHEN bKeepTenantsOnList IS NULL THEN '<<NULL>>' WHEN bKeepTenantsOnList = 1 THEN 'TRUE' WHEN bKeepTenantsOnList = 0 THEN 'FALSE' END AS bKeepTenantsOnList,
              COALESCE(CAST(iApplyToPeriod AS VARCHAR(100)),'<<NULL>>') AS iApplyToPeriod,
              COALESCE(CAST(iApplyToLeaseType AS VARCHAR(100)),'<<NULL>>') AS iApplyToLeaseType,
              COALESCE(CAST(iLabelOption AS VARCHAR(100)),'<<NULL>>') AS iLabelOption,
              COALESCE(CAST(iLetterDeliveryType AS VARCHAR(100)),'<<NULL>>') AS iLetterDeliveryType,
              CASE WHEN bPermanent IS NULL THEN '<<NULL>>' WHEN bPermanent = 1 THEN 'TRUE' WHEN bPermanent = 0 THEN 'FALSE' END AS bPermanent,
              COALESCE(CONVERT(VARCHAR(26),CAST(dDisabled AS DATETIME2(6)),121),'<<NULL>>') AS dDisabled,
              COALESCE(CONVERT(VARCHAR(26),CAST(dDeleted AS DATETIME2(6)),121),'<<NULL>>') AS dDeleted,
              COALESCE(CONVERT(VARCHAR(26),CAST(dUpdated AS DATETIME2(6)),121),'<<NULL>>') AS dUpdated,
              COALESCE(CAST(OldPK AS VARCHAR(100)),'<<NULL>>') AS OldPK,
              COALESCE(CAST(iRemoveDiscount AS VARCHAR(100)),'<<NULL>>') AS iRemoveDiscount,
              COALESCE(CAST(iType AS VARCHAR(100)),'<<NULL>>') AS iType
          FROM dbo.PDueEvents;
        target_table_name: PDueEvents
        target: snowflake
        targetcolumn: PDueEventID
        targetquery: |
          SELECT
              COALESCE(CAST(PDueEventID AS VARCHAR(100)),'<<NULL>>') AS PDueEventID,
              COALESCE(CAST(SiteID AS VARCHAR(100)),'<<NULL>>') AS SiteID,
              COALESCE(CAST(ChargeDescID AS VARCHAR(100)),'<<NULL>>') AS ChargeDescID,
              COALESCE(CAST(FormID AS VARCHAR(100)),'<<NULL>>') AS FormID,
              COALESCE(CAST(iFormAddrOption AS VARCHAR(100)),'<<NULL>>') AS iFormAddrOption,
              COALESCE(CAST(EventName_TermID AS VARCHAR(100)),'<<NULL>>') AS EventName_TermID,
              COALESCE(TRIM(sDefEventName),'<<NULL>>') AS sDefEventName,
              COALESCE(TRIM(sEventName),'<<NULL>>') AS sEventName,
              COALESCE(TRIM(sCategory),'<<NULL>>') AS sCategory,
              COALESCE(TRIM(sComment),'<<NULL>>') AS sComment,
              COALESCE(CAST(iDayPastDue AS VARCHAR(100)),'<<NULL>>') AS iDayPastDue,
              CASE WHEN bShowOnReminders IS NULL THEN '<<NULL>>' WHEN bShowOnReminders = TRUE THEN 'TRUE' WHEN bShowOnReminders = FALSE THEN 'FALSE' END AS bShowOnReminders,
              CASE WHEN bRecurring IS NULL THEN '<<NULL>>' WHEN bRecurring = TRUE THEN 'TRUE' WHEN bRecurring = FALSE THEN 'FALSE' END AS bRecurring,
              CASE WHEN bKeepTenantsOnList IS NULL THEN '<<NULL>>' WHEN bKeepTenantsOnList = TRUE THEN 'TRUE' WHEN bKeepTenantsOnList = FALSE THEN 'FALSE' END AS bKeepTenantsOnList,
              COALESCE(CAST(iApplyToPeriod AS VARCHAR(100)),'<<NULL>>') AS iApplyToPeriod,
              COALESCE(CAST(iApplyToLeaseType AS VARCHAR(100)),'<<NULL>>') AS iApplyToLeaseType,
              COALESCE(CAST(iLabelOption AS VARCHAR(100)),'<<NULL>>') AS iLabelOption,
              COALESCE(CAST(iLetterDeliveryType AS VARCHAR(100)),'<<NULL>>') AS iLetterDeliveryType,
              CASE WHEN bPermanent IS NULL THEN '<<NULL>>' WHEN bPermanent = TRUE THEN 'TRUE' WHEN bPermanent = FALSE THEN 'FALSE' END AS bPermanent,
              COALESCE(TO_CHAR(dDisabled,'YYYY-MM-DD HH24:MI:SS.FF6'),'<<NULL>>') AS dDisabled,
              COALESCE(TO_CHAR(dDeleted,'YYYY-MM-DD HH24:MI:SS.FF6'),'<<NULL>>') AS dDeleted,
              COALESCE(TO_CHAR(dUpdated,'YYYY-MM-DD HH24:MI:SS.FF6'),'<<NULL>>') AS dUpdated,
              COALESCE(CAST(OldPK AS VARCHAR(100)),'<<NULL>>') AS OldPK,
              COALESCE(CAST(iRemoveDiscount AS VARCHAR(100)),'<<NULL>>') AS iRemoveDiscount,
              COALESCE(CAST(iType AS VARCHAR(100)),'<<NULL>>') AS iType
          FROM DEV_SITELINK_BRONZE.AWSDEV_DEVT5000_DBO.PDueEvents
          WHERE _FIVETRAN_ACTIVE = TRUE;
