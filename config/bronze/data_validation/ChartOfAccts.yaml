tables:
  ChartOfAccts:
    validations:
      data_validation:
        source_table_name: ChartOfAccts
        source: mssql
        sourcecolumn: ChartOfAcctID
        sourcequery: |
          SELECT
              COALESCE(CAST(ChartOfAcctID AS VARCHAR(100)),'<<NULL>>') AS ChartOfAcctID,
              COALESCE(CAST(SiteID AS VARCHAR(100)),'<<NULL>>') AS SiteID,
              COALESCE(CAST(AcctTypeID AS VARCHAR(100)),'<<NULL>>') AS AcctTypeID,
              COALESCE(LTRIM(RTRIM(sDefAcctCode)),'<<NULL>>') AS sDefAcctCode,
              COALESCE(LTRIM(RTRIM(sAcctCode)),'<<NULL>>') AS sAcctCode,
              COALESCE(CAST(AcctName_TermID AS VARCHAR(100)),'<<NULL>>') AS AcctName_TermID,
              COALESCE(LTRIM(RTRIM(sDefAcctName)),'<<NULL>>') AS sDefAcctName,
              COALESCE(LTRIM(RTRIM(sAcctName)),'<<NULL>>') AS sAcctName,
              COALESCE(CAST(SubAcctName_TermID AS VARCHAR(100)),'<<NULL>>') AS SubAcctName_TermID,
              COALESCE(LTRIM(RTRIM(sDefSubAcctName)),'<<NULL>>') AS sDefSubAcctName,
              COALESCE(LTRIM(RTRIM(sSubAcctName)),'<<NULL>>') AS sSubAcctName,
              CASE WHEN bPermanent IS NULL THEN '<<NULL>>' WHEN bPermanent = 1 THEN 'TRUE' WHEN bPermanent = 0 THEN 'FALSE' END AS bPermanent,
              COALESCE(CONVERT(VARCHAR(26),CAST(dDisabled AS DATETIME2(6)),121),'<<NULL>>') AS dDisabled,
              COALESCE(CONVERT(VARCHAR(26),CAST(dDeleted AS DATETIME2(6)),121),'<<NULL>>') AS dDeleted,
              COALESCE(CONVERT(VARCHAR(26),CAST(dUpdated AS DATETIME2(6)),121),'<<NULL>>') AS dUpdated,
              COALESCE(CAST(OldPK AS VARCHAR(100)),'<<NULL>>') AS OldPK
          FROM dbo.ChartOfAccts;
        target_table_name: ChartOfAccts
        target: snowflake
        targetcolumn: ChartOfAcctID
        targetquery: |
          SELECT
              COALESCE(CAST(ChartOfAcctID AS VARCHAR(100)),'<<NULL>>') AS ChartOfAcctID,
              COALESCE(CAST(SiteID AS VARCHAR(100)),'<<NULL>>') AS SiteID,
              COALESCE(CAST(AcctTypeID AS VARCHAR(100)),'<<NULL>>') AS AcctTypeID,
              COALESCE(TRIM(sDefAcctCode),'<<NULL>>') AS sDefAcctCode,
              COALESCE(TRIM(sAcctCode),'<<NULL>>') AS sAcctCode,
              COALESCE(CAST(AcctName_TermID AS VARCHAR(100)),'<<NULL>>') AS AcctName_TermID,
              COALESCE(TRIM(sDefAcctName),'<<NULL>>') AS sDefAcctName,
              COALESCE(TRIM(sAcctName),'<<NULL>>') AS sAcctName,
              COALESCE(CAST(SubAcctName_TermID AS VARCHAR(100)),'<<NULL>>') AS SubAcctName_TermID,
              COALESCE(TRIM(sDefSubAcctName),'<<NULL>>') AS sDefSubAcctName,
              COALESCE(TRIM(sSubAcctName),'<<NULL>>') AS sSubAcctName,
              CASE WHEN bPermanent IS NULL THEN '<<NULL>>' WHEN bPermanent = TRUE THEN 'TRUE' WHEN bPermanent = FALSE THEN 'FALSE' END AS bPermanent,
              COALESCE(TO_CHAR(dDisabled,'YYYY-MM-DD HH24:MI:SS.FF6'),'<<NULL>>') AS dDisabled,
              COALESCE(TO_CHAR(dDeleted,'YYYY-MM-DD HH24:MI:SS.FF6'),'<<NULL>>') AS dDeleted,
              COALESCE(TO_CHAR(dUpdated,'YYYY-MM-DD HH24:MI:SS.FF6'),'<<NULL>>') AS dUpdated,
              COALESCE(CAST(OldPK AS VARCHAR(100)),'<<NULL>>') AS OldPK
          FROM DEV_SITELINK_BRONZE.AWSDEV_DEVT5000_DBO.ChartOfAccts
          WHERE _FIVETRAN_ACTIVE = TRUE;
