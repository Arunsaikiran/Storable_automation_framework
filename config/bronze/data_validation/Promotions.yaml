              COALESCE(CONVERT(VARCHAR(26),CAST(dDeleted AS DATETIME2(6)),121),'<<NULL>>') AS dDeleted,
              COALESCE(CAST(OldPK AS VARCHAR(100)),'<<NULL>>') AS OldPK
          FROM dbo.Promotions;
        target_table_name: Promotions
        target: snowflake
        targetcolumn: PromotionID
        targetquery: |
          SELECT
              COALESCE(CAST(PromotionID AS VARCHAR(100)),'<<NULL>>') AS PromotionID,
              COALESCE(CAST(SiteID AS VARCHAR(100)),'<<NULL>>') AS SiteID,
              COALESCE(CAST(iPromoGlobalNum AS VARCHAR(100)),'<<NULL>>') AS iPromoGlobalNum,
              CASE WHEN bWebEditable IS NULL THEN '<<NULL>>' WHEN bWebEditable = TRUE THEN 'TRUE' WHEN bWebEditable = FALSE THEN 'FALSE' END AS bWebEditable,
