              CASE WHEN bSuffixRequired IS NULL THEN '<<NULL>>' WHEN bSuffixRequired = 1 THEN 'TRUE' WHEN bSuffixRequired = 0 THEN 'FALSE' END AS bSuffixRequired,
              COALESCE(LTRIM(RTRIM(sSuffix)),'<<NULL>>') AS sSuffix,
              COALESCE(CAST(iManagedBy_CorpUserID AS VARCHAR(100)),'<<NULL>>') AS iManagedBy_CorpUserID,
              CASE WHEN bPermanent IS NULL THEN '<<NULL>>' WHEN bPermanent = 1 THEN 'TRUE' WHEN bPermanent = 0 THEN 'FALSE' END AS bPermanent,
              CASE WHEN bApproved IS NULL THEN '<<NULL>>' WHEN bApproved = 1 THEN 'TRUE' WHEN bApproved = 0 THEN 'FALSE' END AS bApproved,
              COALESCE(CONVERT(VARCHAR(26),CAST(dApproved AS DATETIME2(6)),121),'<<NULL>>') AS dApproved,
              CASE WHEN bForAllSites IS NULL THEN '<<NULL>>' WHEN bForAllSites = 1 THEN 'TRUE' WHEN bForAllSites = 0 THEN 'FALSE' END AS bForAllSites,
              COALESCE(CONVERT(VARCHAR(26),CAST(dDisabled AS DATETIME2(6)),121),'<<NULL>>') AS dDisabled,
