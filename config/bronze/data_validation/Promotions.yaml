              COALESCE(TRIM(sPromoComment),'<<NULL>>') AS sPromoComment,
              COALESCE(TRIM(sWebDesc),'<<NULL>>') AS sWebDesc,
              COALESCE(CAST(dcMarketingDollars AS VARCHAR(100)),'<<NULL>>') AS dcMarketingDollars,
              CASE WHEN bGeneric IS NULL THEN '<<NULL>>' WHEN bGeneric = TRUE THEN 'TRUE' WHEN bGeneric = FALSE THEN 'FALSE' END AS bGeneric,
              CASE WHEN bWebOnly IS NULL THEN '<<NULL>>' WHEN bWebOnly = TRUE THEN 'TRUE' WHEN bWebOnly = FALSE THEN 'FALSE' END AS bWebOnly,
              CASE WHEN bWebExcluded IS NULL THEN '<<NULL>>' WHEN bWebExcluded = TRUE THEN 'TRUE' WHEN bWebExcluded = FALSE THEN 'FALSE' END AS bWebExcluded,
