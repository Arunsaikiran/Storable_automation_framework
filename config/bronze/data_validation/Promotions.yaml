tables:
  Promotions:
    validations:
      data_validation:
        source_table_name: Promotions
        source: mssql
        sourcecolumn: PromotionID
        sourcequery: |
          SELECT
              COALESCE(CAST(PromotionID AS VARCHAR(100)),'<<NULL>>') AS PromotionID,
              COALESCE(CAST(SiteID AS VARCHAR(100)),'<<NULL>>') AS SiteID,
              COALESCE(CAST(iPromoGlobalNum AS VARCHAR(100)),'<<NULL>>') AS iPromoGlobalNum,
              CASE WHEN bWebEditable IS NULL THEN '<<NULL>>' WHEN bWebEditable = 1 THEN 'TRUE' WHEN bWebEditable = 0 THEN 'FALSE' END AS bWebEditable,
              COALESCE(LTRIM(RTRIM(sCorpCode)),'<<NULL>>') AS sCorpCode,
              CASE WHEN bSiteIsEligible IS NULL THEN '<<NULL>>' WHEN bSiteIsEligible = 1 THEN 'TRUE' WHEN bSiteIsEligible = 0 THEN 'FALSE' END AS bSiteIsEligible,
              COALESCE(CAST(PromoAccountID AS VARCHAR(100)),'<<NULL>>') AS PromoAccountID,
              COALESCE(CAST(PromoChannelID AS VARCHAR(100)),'<<NULL>>') AS PromoChannelID,
              COALESCE(CAST(PromoFormatsID AS VARCHAR(100)),'<<NULL>>') AS PromoFormatsID,
              COALESCE(CAST(PromoCampaignID AS VARCHAR(100)),'<<NULL>>') AS PromoCampaignID,
              COALESCE(CAST(PromoTypeID AS VARCHAR(100)),'<<NULL>>') AS PromoTypeID,
              COALESCE(CAST(PromoOfferID AS VARCHAR(100)),'<<NULL>>') AS PromoOfferID,
              COALESCE(LTRIM(RTRIM(sGlobalSiteNum)),'<<NULL>>') AS sGlobalSiteNum,
              COALESCE(CONVERT(VARCHAR(26),CAST(dMaterialsDrop AS DATETIME2(6)),121),'<<NULL>>') AS dMaterialsDrop,
              COALESCE(CONVERT(VARCHAR(26),CAST(dPromoStrt AS DATETIME2(6)),121),'<<NULL>>') AS dPromoStrt,
              COALESCE(CONVERT(VARCHAR(26),CAST(dPromoEnd AS DATETIME2(6)),121),'<<NULL>>') AS dPromoEnd,
              COALESCE(CONVERT(VARCHAR(26),CAST(dCreated AS DATETIME2(6)),121),'<<NULL>>') AS dCreated,
              COALESCE(LTRIM(RTRIM(sPromotionCode)),'<<NULL>>') AS sPromotionCode,
              COALESCE(LTRIM(RTRIM(sPromoDescription)),'<<NULL>>') AS sPromoDescription,
              COALESCE(LTRIM(RTRIM(sPromoComment)),'<<NULL>>') AS sPromoComment,
              COALESCE(LTRIM(RTRIM(sWebDesc)),'<<NULL>>') AS sWebDesc,
              COALESCE(CAST(dcMarketingDollars AS VARCHAR(100)),'<<NULL>>') AS dcMarketingDollars,
              CASE WHEN bGeneric IS NULL THEN '<<NULL>>' WHEN bGeneric = 1 THEN 'TRUE' WHEN bGeneric = 0 THEN 'FALSE' END AS bGeneric,
