tables:
  MktgType:
    validations:
      data_validation:
        source_table_name: MktgType
        source: mssql
        sourcecolumn: MktgTypeID
        sourcequery: |
          SELECT
              COALESCE(CAST(MktgTypeID AS VARCHAR(100)),'<<NULL>>') AS MktgTypeID,
              COALESCE(CAST(SiteID AS VARCHAR(100)),'<<NULL>>') AS SiteID,
              COALESCE(CAST(MktgMktgType_TermID AS VARCHAR(100)),'<<NULL>>') AS MktgMktgType_TermID,
              COALESCE(LTRIM(RTRIM(sDefMktgTypeDesc)),'<<NULL>>') AS sDefMktgTypeDesc,
              COALESCE(LTRIM(RTRIM(sMktgTypeDesc)),'<<NULL>>') AS sMktgTypeDesc,
              CASE WHEN bCommercial IS NULL THEN '<<NULL>>' WHEN bCommercial = 1 THEN 'TRUE' WHEN bCommercial = 0 THEN 'FALSE' END AS bCommercial,
              CASE WHEN bPermanent IS NULL THEN '<<NULL>>' WHEN bPermanent = 1 THEN 'TRUE' WHEN bPermanent = 0 THEN 'FALSE' END AS bPermanent,
              COALESCE(CONVERT(VARCHAR(26),CAST(dDeleted AS DATETIME2(6)),121),'<<NULL>>') AS dDeleted,
              COALESCE(CONVERT(VARCHAR(26),CAST(dUpdated AS DATETIME2(6)),121),'<<NULL>>') AS dUpdated,
              COALESCE(CAST(OldPK AS VARCHAR(100)),'<<NULL>>') AS OldPK
          FROM dbo.MktgType;
        target_table_name: MktgType
        target: snowflake
        targetcolumn: MktgTypeID
        targetquery: |
          SELECT
              COALESCE(CAST(MktgTypeID AS VARCHAR(100)),'<<NULL>>') AS MktgTypeID,
              COALESCE(CAST(SiteID AS VARCHAR(100)),'<<NULL>>') AS SiteID,
              COALESCE(CAST(MktgMktgType_TermID AS VARCHAR(100)),'<<NULL>>') AS MktgMktgType_TermID,
              COALESCE(TRIM(sDefMktgTypeDesc),'<<NULL>>') AS sDefMktgTypeDesc,
              COALESCE(TRIM(sMktgTypeDesc),'<<NULL>>') AS sMktgTypeDesc,
              CASE WHEN bCommercial IS NULL THEN '<<NULL>>' WHEN bCommercial = TRUE THEN 'TRUE' WHEN bCommercial = FALSE THEN 'FALSE' END AS bCommercial,
              CASE WHEN bPermanent IS NULL THEN '<<NULL>>' WHEN bPermanent = TRUE THEN 'TRUE' WHEN bPermanent = FALSE THEN 'FALSE' END AS bPermanent,
              COALESCE(TO_CHAR(dDeleted,'YYYY-MM-DD HH24:MI:SS.FF6'),'<<NULL>>') AS dDeleted,
              COALESCE(TO_CHAR(dUpdated,'YYYY-MM-DD HH24:MI:SS.FF6'),'<<NULL>>') AS dUpdated,
              COALESCE(CAST(OldPK AS VARCHAR(100)),'<<NULL>>') AS OldPK
          FROM DEV_SITELINK_BRONZE.AWSDEV_DEVT5000_DBO.MktgType
          WHERE _FIVETRAN_ACTIVE = TRUE;
